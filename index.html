<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Español</title>
  <meta name="theme-color" content="#f4f0e8">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f4f0e8;
      --surface: #ffffff;
      --card: #fdfbf7;
      --border: #ddd4c4;
      --border-soft: #ede7da;
      --text: #1c1610;
      --muted: #7a6c5a;
      --dim: #bdb0a0;
      --gold: #8a6218;
      --gold-mid: #a87828;
      --gold-glow: rgba(138, 98, 24, 0.08);
      --rust: #922e18;
      --sage: #2a5e3a;
      --err-bg: rgba(146, 46, 24, 0.07);
      --ok-bg: rgba(42, 94, 58, 0.07);
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.05);
    }

    body {
      font-family: 'Fira Code', monospace;
      background:
        radial-gradient(ellipse 60% 50% at 15% 20%, rgba(200, 160, 70, 0.07) 0%, transparent 100%),
        radial-gradient(ellipse 45% 60% at 85% 80%, rgba(160, 120, 60, 0.05) 0%, transparent 100%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* ─── Fixed chrome ─────────────────── */
    .back-btn {
      position: fixed;
      top: 22px; left: 22px;
      background: none; border: none;
      color: var(--dim);
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      cursor: pointer;
      display: flex; align-items: center; gap: 7px;
      transition: color 0.2s;
      padding: 6px;
    }
    .back-btn:hover { color: var(--muted); }
    .back-btn.hidden { visibility: hidden; pointer-events: none; }

    .settings-btn {
      position: fixed;
      top: 22px; right: 22px;
      width: 36px; height: 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--dim);
      cursor: pointer;
      display: grid; place-items: center;
      border-radius: 3px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
    }
    .settings-btn:hover {
      border-color: var(--gold-mid);
      color: var(--gold);
      box-shadow: var(--shadow-md);
    }

    /* ─── Views ────────────────────────── */
    .app { width: 400px; max-width: 92vw; }

    .view { display: none; animation: rise 0.28s ease both; }
    .view.active { display: block; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── HOME ─────────────────────────── */
    .home-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(48px, 14vw, 68px);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.04em;
      line-height: 1;
      text-align: center;
      margin-bottom: 10px;
      color: var(--text);
    }
    .home-title em { color: var(--gold); font-style: normal; }

    .home-sub {
      text-align: center;
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    .rule {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border), transparent);
      margin-bottom: 40px;
    }

    .home-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 28px;
    }

    .main-btn {
      padding: 30px 12px;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      color: var(--text);
      cursor: pointer;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      display: flex; flex-direction: column;
      align-items: center; gap: 14px;
      border-radius: 3px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.22s, transform 0.2s, box-shadow 0.22s;
      position: relative; overflow: hidden;
    }
    .main-btn::after {
      content: '';
      position: absolute; inset: 0;
      background: var(--gold-glow);
      opacity: 0; transition: opacity 0.22s;
    }
    .main-btn:hover {
      border-color: var(--gold-mid);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .main-btn:hover::after { opacity: 1; }

    .btn-glyph { font-size: 22px; line-height: 1; }
    .main-btn.primary .btn-glyph { color: var(--gold); }
    .main-btn.secondary .btn-glyph { color: var(--dim); }

    .home-stats {
      text-align: center;
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 0.1em;
    }
    .home-stats b { color: var(--muted); font-weight: 400; }
    .home-stats .dot { margin: 0 9px; }
    .home-stats .due-badge { color: var(--gold); }
    .home-stats .due-badge b { color: var(--gold); }

    .practice-note {
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--sage);
      background: var(--ok-bg);
      border-radius: 6px;
      padding: 7px 12px;
      margin-bottom: 14px;
    }

    /* ─── QUIZ ─────────────────────────── */
    .quiz-prompt {
      text-align: center;
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .word-card {
      border: 1px solid var(--border-soft);
      background: var(--surface);
      padding: 52px 28px 40px;
      text-align: center;
      margin-bottom: 24px;
      border-radius: 3px;
      box-shadow: var(--shadow-sm);
      position: relative;
      transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
    }
    .word-card::before, .word-card::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      border-color: var(--gold-mid);
      border-style: solid;
      opacity: 0.35;
    }
    .word-card::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
    .word-card::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

    .word-card.state-ok  { border-color: var(--sage); background: var(--ok-bg); }
    .word-card.state-err { border-color: var(--rust); background: var(--err-bg); }

    .quiz-word {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(34px, 10vw, 54px);
      font-weight: 300;
      font-style: italic;
      line-height: 1.1;
      color: var(--text);
      overflow-wrap: break-word;
    }
    .quiz-word-kr {
      font-style: normal;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      font-size: clamp(26px, 8vw, 38px);
      font-weight: 300;
    }

    .word-meta {
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.1em;
      margin-top: 10px;
    }
    .word-meta b { color: var(--muted); font-weight: 400; }

    /* direction badge */
    .quiz-dir {
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 20px;
    }

    /* gender badge */
    .gender-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 3px 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--bg);
    }

    /* answer input row */
    .answer-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .answer-input {
      flex: 1;
      padding: 13px 15px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Fira Code', 'Malgun Gothic', sans-serif;
      font-size: 15px;
      outline: none;
      border-radius: 3px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .answer-input:focus { border-color: var(--gold-mid); box-shadow: 0 0 0 3px var(--gold-glow); }
    .answer-input:disabled { opacity: 0.6; }

    .submit-btn {
      padding: 13px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      border-radius: 3px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.18s, color 0.18s;
      flex-shrink: 0;
    }
    .submit-btn:hover:not(:disabled) { border-color: var(--gold-mid); color: var(--text); }
    .submit-btn:disabled { opacity: 0.3; cursor: default; }

    .quiz-fb {
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.18em;
      min-height: 18px;
    }
    .quiz-fb.ok  { color: var(--sage); }
    .quiz-fb.err { color: var(--rust); }

    /* correct answer reveal */
    .correct-reveal {
      display: none;
      margin-top: 10px;
      padding: 12px 16px;
      background: var(--err-bg);
      border: 1px solid var(--rust);
      border-radius: 3px;
      font-size: 13px;
      color: var(--text);
      animation: rise 0.2s ease both;
    }
    .correct-reveal.show { display: block; }
    .correct-reveal .reveal-label {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--rust);
      display: block;
      margin-bottom: 4px;
    }
    .correct-reveal .reveal-word {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-style: italic;
    }

    /* 악센트만 틀렸을 때: 정답 처리하되 금색 안내로 올바른 표기를 각인 */
    .correct-reveal.accent {
      background: var(--gold-glow);
      border-color: var(--gold-mid);
    }
    .correct-reveal.accent .reveal-label { color: var(--gold); }
    .reveal-word .acc { color: var(--gold); font-style: normal; font-weight: 500; }

    .next-btn {
      width: 100%; margin-top: 14px; padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      border-radius: 3px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, color 0.2s;
      display: none;
    }
    .next-btn.show { display: block; animation: rise 0.25s ease both; }
    .next-btn:hover { border-color: var(--gold-mid); color: var(--text); }

    .empty-quiz {
      text-align: center;
      padding: 64px 0;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
      line-height: 2.2;
    }

    /* ─── ADD WORD ──────────────────────── */
    .form-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(26px, 7vw, 34px);
      font-weight: 300;
      font-style: italic;
      text-align: center;
      margin-bottom: 36px;
      color: var(--text);
    }

    .field { margin-bottom: 22px; }

    .field-label {
      display: block;
      font-size: 9px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 9px;
      display: flex; align-items: center; gap: 8px;
    }
    .field-label .optional {
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--dim);
      font-style: italic;
      text-transform: none;
    }

    .word-input {
      width: 100%;
      padding: 13px 15px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-style: italic;
      outline: none;
      border-radius: 3px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .word-input::placeholder { color: var(--dim); font-style: italic; }
    .word-input:focus { border-color: var(--gold-mid); box-shadow: 0 0 0 3px var(--gold-glow); }

    .meaning-input {
      width: 100%;
      padding: 11px 15px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Fira Code', 'Malgun Gothic', sans-serif;
      font-size: 15px;
      outline: none;
      border-radius: 3px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .meaning-input::placeholder { color: var(--dim); }
    .meaning-input:focus { border-color: var(--gold-mid); box-shadow: 0 0 0 3px var(--gold-glow); }

    .wordlist-btn {
      width: 100%; margin-top: 10px; padding: 13px;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      color: var(--muted);
      cursor: pointer;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-radius: 3px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, color 0.2s;
    }
    .wordlist-btn:hover { border-color: var(--gold-mid); color: var(--text); }

    .wl-search {
      width: 100%;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Fira Code', 'Malgun Gothic', sans-serif;
      font-size: 13px;
      outline: none;
      border-radius: 3px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 12px;
    }
    .wl-search::placeholder { color: var(--dim); }
    .wl-search:focus { border-color: var(--gold-mid); box-shadow: 0 0 0 3px var(--gold-glow); }

    .wl-count {
      text-align: center;
      font-size: 11px; color: var(--dim);
      letter-spacing: 0.1em;
      margin-bottom: 14px;
    }
    .wl-body { max-height: 62vh; overflow-y: auto; }
    .wl-item {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: 3px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .wl-item:hover { border-color: var(--gold-mid); box-shadow: var(--shadow-md); }
    .wl-item:active { background: var(--card); }
    .wl-word {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px; font-style: italic; font-weight: 300;
      color: var(--text);
    }
    .wl-meaning { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .wl-left { flex: 1; min-width: 0; }
    .wl-right { flex-shrink: 0; text-align: right; }
    .wl-stat { font-size: 10px; color: var(--dim); letter-spacing: 0.08em; }
    .wl-edit-glyph {
      display: block; margin-top: 8px;
      font-size: 12px; color: var(--dim);
    }
    .wl-item:hover .wl-edit-glyph { color: var(--gold); }

    /* ─── EDIT SHEET ────────────────────── */
    .sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.14);
      padding: 24px 22px calc(env(safe-area-inset-bottom, 0px) + 24px);
      max-height: 88dvh;
      overflow-y: auto;
      transform: translateY(105%);
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 61;
    }
    .sheet.open { transform: translateY(0); }

    @media (min-width: 601px) {
      .sheet {
        left: 50%; right: auto; bottom: auto; top: 50%;
        width: 400px; max-height: 86vh;
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: var(--shadow-md);
        transform: translate(-50%, -47%);
        opacity: 0; pointer-events: none;
        transition: opacity 0.22s, transform 0.22s;
      }
      .sheet.open {
        transform: translate(-50%, -50%);
        opacity: 1; pointer-events: all;
      }
    }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 26px;
    }

    #sheetOverlay { z-index: 60; }

    .gender-pick.four { grid-template-columns: repeat(4, 1fr); }

    .delete-btn {
      width: 100%; margin-top: 10px; padding: 13px;
      background: none;
      border: 1px solid transparent;
      color: var(--rust);
      opacity: 0.7;
      cursor: pointer;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border-radius: 3px;
      transition: border-color 0.2s, background 0.2s, opacity 0.2s;
    }
    .delete-btn:hover { opacity: 1; }
    .delete-btn.armed {
      border-color: var(--rust);
      background: var(--err-bg);
      opacity: 1;
    }

    .shortcut-hint {
      margin-top: 6px;
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.06em;
    }
    .shortcut-hint kbd {
      display: inline-block;
      padding: 1px 5px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-family: 'Fira Code', monospace;
      font-size: 10px;
      color: var(--muted);
    }

    .gender-pick {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .g-opt {
      padding: 13px 6px;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      color: var(--muted);
      cursor: pointer;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
      border-radius: 3px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.18s, color 0.18s, background 0.18s;
    }
    .g-opt:hover { border-color: var(--gold-mid); color: var(--text); }
    .g-opt.on {
      border-color: var(--gold-mid);
      color: var(--gold);
      background: var(--gold-glow);
    }

    /* subtle none-hint below gender buttons */
    .none-hint {
      margin-top: 8px;
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.08em;
      text-align: center;
      min-height: 16px;
      transition: opacity 0.2s;
    }

    .add-btn {
      width: 100%; margin-top: 26px; padding: 15px;
      background: var(--surface);
      border: 1px solid var(--gold-mid);
      color: var(--gold);
      cursor: pointer;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      border-radius: 3px;
      box-shadow: var(--shadow-sm);
      transition: background 0.2s, box-shadow 0.2s;
    }
    .add-btn:hover:not(:disabled) {
      background: var(--gold-glow);
      box-shadow: var(--shadow-md);
    }
    .add-btn:disabled { opacity: 0.3; cursor: default; box-shadow: none; }

    .add-msg {
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.14em;
      min-height: 18px;
      margin-top: 12px;
    }

    /* ─── SETTINGS DRAWER ───────────────── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.22);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
      z-index: 50;
      backdrop-filter: blur(2px);
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    .drawer {
      position: fixed;
      top: 0; right: 0;
      width: 264px; max-width: 82vw;
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: -4px 0 24px rgba(0,0,0,0.08);
      padding: 28px 24px;
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 51;
    }
    .drawer.open { transform: translateX(0); }

    .drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 44px;
    }

    .drawer-title {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .close-btn {
      background: none; border: none;
      color: var(--dim); cursor: pointer;
      font-size: 20px; line-height: 1;
      transition: color 0.18s; padding: 2px 4px;
    }
    .close-btn:hover { color: var(--text); }

    .drawer-section-label {
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 14px;
    }

    .lang-list { display: flex; flex-direction: column; gap: 4px; }

    .lang-btn {
      padding: 11px 13px;
      background: none;
      border: 1px solid transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      text-align: left;
      display: flex; align-items: center; gap: 11px;
      border-radius: 3px;
      transition: border-color 0.18s, color 0.18s, background 0.18s;
    }
    .lang-btn:hover { border-color: var(--border); color: var(--text); background: var(--card); }
    .lang-btn.on {
      border-color: var(--gold-mid);
      color: var(--gold);
      background: var(--gold-glow);
    }

    .lang-pip {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--border); flex-shrink: 0;
      transition: background 0.18s;
    }
    .lang-btn.on .lang-pip { background: var(--gold); }

    /* ─── MOBILE ───────────────────────── */
    /* 터치 기기: alt 단축키 안내 숨김 */
    @media (hover: none) {
      .shortcut-hint { display: none; }
    }

    @media (max-width: 600px) {
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-y: auto;
        min-height: 100dvh;
        padding: calc(env(safe-area-inset-top, 0px) + 72px)
                 16px
                 calc(env(safe-area-inset-bottom, 0px) + 32px);
      }
      /* margin auto: 내용이 짧으면 세로 중앙, 길면 자연스럽게 스크롤 */
      .app { margin: auto; width: 100%; max-width: 400px; }

      .back-btn { top: calc(env(safe-area-inset-top, 0px) + 14px); left: 10px; }
      .settings-btn { top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px; }

      .home-sub { margin-bottom: 36px; }
      .rule { margin-bottom: 30px; }

      .word-card { padding: 40px 20px 32px; }

      .form-heading { margin-bottom: 28px; }

      /* iOS는 16px 미만 입력창 포커스 시 화면을 강제 확대함 */
      .answer-input, .meaning-input, .wl-search { font-size: 16px; }

      /* 내부 스크롤 대신 페이지 스크롤 사용 */
      .wl-body { max-height: none; }

      .drawer { height: 100dvh; padding-top: calc(env(safe-area-inset-top, 0px) + 28px); }

      /* 키보드가 열려 있는 동안 퀴즈 카드를 압축해 가려지지 않게 함 */
      body.kb-open .practice-note,
      body.kb-open .word-meta { display: none; }
      body.kb-open .word-card { padding: 18px 16px 16px; margin-bottom: 14px; }
      body.kb-open .quiz-dir { margin-bottom: 8px; }
      body.kb-open .quiz-word { font-size: clamp(24px, 7vw, 34px); }
      body.kb-open .quiz-word-kr { font-size: clamp(20px, 6vw, 28px); }
      body.kb-open .gender-badge { margin-top: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <button class="back-btn hidden" id="backBtn" onclick="goHome()">
    ← <span id="lBack">뒤로</span>
  </button>
  <button class="settings-btn" onclick="toggleDrawer()">

      <circle cx="7.5" cy="7.5" r="2.2"/>

  </button>

  <div class="app">

    <!-- ── HOME ── -->
    <div class="view active" id="vHome">

        <p class="shortcut-hint">

          <kbd>alt</kbd>+<kbd>n</kbd> → ñ &ensp;
          <kbd>alt</kbd>+<kbd>/</kbd> → ¿ &ensp;

      </button>

      </button>

    </div>
    <div class="field">
      <label class="field-label" id="lEditGenderLabel">성별</label>
      <div class="gender-pick four">
        <button class="g-opt" id="eg-m" onclick="pickEditGender('m')"><span id="lEgM">남성</span></button>
        <button class="g-opt" id="eg-f" onclick="pickEditGender('f')"><span id="lEgF">여성</span></button>
        <button class="g-opt" id="eg-n" onclick="pickEditGender('n')"><span id="lEgN">양성</span></button>
        <button class="g-opt" id="eg-none" onclick="pickEditGender('none')"><span id="lEgNone">없음</span></button>
      </div>
    </div>
    <button class="add-btn" id="editSave" onclick="saveEditSheet()">저장</button>
    <button class="delete-btn" id="editDelete" onclick="deleteFromSheet()">삭제</button>
    <p class="add-msg" id="editMsg"></p>

<script>
// ── i18n ──────────────────────────────────────────────
const T = {
  ko: {
    sub: '단어를 정복하라',
    quiz: '퀴즈', add: '단어 추가',

    noneHint: 'Sin selección → sin género (verbos, etc.)',
    placeholder: 'palabra...', meaningPlaceholder: 'significado en coreano...',

  en: {

    quiz: 'Quiz', add: 'Add Word',

    formTitle: 'Add Word', wordLabel: 'Word', meaningLabel: 'Meaning', genderLabel: 'Gender',
    optional: '(optional)',
    noneHint: 'No selection → saved as genderless (verbs, etc.)',
    placeholder: 'palabra...', meaningPlaceholder: 'Korean meaning...',
    addBtn: 'Add', added: 'Added!', duplicate: 'Word already exists',
    back: 'Back',
    noWords: 'Your word bank is empty\nAdd some words first',
    words: 'words', accuracy: 'accuracy',
    tested: 'tested', correctN: 'correct',
    dirSK: 'Spanish → Korean', dirKS: 'Korean → Spanish',
    answerSK: 'Korean meaning...', answerKS: 'español...',
    correct: 'Correct!', wrong: 'Wrong',
    correctAnswer: 'Answer',
    next: 'Next →',
    wordList: 'Word List', save: 'Save',
    searchPlaceholder: 'Search word or meaning...',
    due: 'to review', reviewDone: 'All reviews done! Free practice',
    editTitle: 'Edit word', gNone: 'None',
    delete: 'Delete', confirmDelete: 'Tap again to delete',
    accentFb: 'Correct · mind the accent!', accentTitle: 'Mind the accent',
  },
};

// ── State ─────────────────────────────────────────────
let lang = localStorage.getItem('lang') || 'ko';
let selGender = null;
let qWord = null;
let qAnswered = false;

// ── API helper ────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  if (!res.ok) throw await res.json();
  return res.json();
}

// ── Helpers ───────────────────────────────────────────
const t = k => T[lang][k];

// ── View routing ──────────────────────────────────────
// 브라우저/핸드폰 뒤로가기와 연동: 화면 전환과 시트·서랍 열림을 히스토리에 기록
let curView = 'home';

function show(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('v' + view[0].toUpperCase() + view.slice(1)).classList.add('active');
  document.getElementById('backBtn').classList.toggle('hidden', view === 'home');
  curView = view;
  renderTexts();
}

function go(view) {
  if (view !== curView) history.pushState({ view }, '');
  show(view);
}

function goHome() { history.back(); }

function loadView(view) {
  if (view === 'quiz') { show('quiz'); loadQuiz(); }
  else if (view === 'wordList') { show('wordList'); loadWordListBody(); }
  else if (view === 'home') { updateStats(); show('home'); }
  else show(view);
}

window.addEventListener('popstate', e => {
  const st = e.state || { view: 'home' };
  const overlayWasOpen = document.getElementById('editSheet').classList.contains('open')
    || document.getElementById('drawer').classList.contains('open');
  doCloseSheet();
  doCloseDrawer();
  // 시트/서랍만 닫는 뒤로가기면 화면은 그대로 유지 (검색어·스크롤 보존)
  if (overlayWasOpen && st.view === curView && !st.sheet && !st.drawer) return;
  loadView(st.view || 'home');
});

// ── Settings drawer ───────────────────────────────────
function toggleDrawer() {
  if (document.getElementById('drawer').classList.contains('open')) {
    history.back();
    return;
  }
  history.pushState({ view: curView, drawer: true }, '');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function doCloseDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

function setLang(l) {
  lang = l;
  localStorage.setItem('lang', l);
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('on', b.id === 'btn-' + l)
  );
  renderTexts();
}

// ── Render all text ───────────────────────────────────
function renderTexts() {
  document.getElementById('lBack').textContent = t('back');
  document.getElementById('lSub').textContent = t('sub');
  document.getElementById('lQuiz').textContent = t('quiz');
  document.getElementById('lAdd').textContent = t('add');
  document.getElementById('lSettings').textContent = t('settings');
  document.getElementById('lLangSection').textContent = t('langSec');
  document.getElementById('lFormTitle').textContent = t('formTitle');
  document.getElementById('lWordLabel').textContent = t('wordLabel');
  document.getElementById('lMeaningLabel').textContent = t('meaningLabel');
  document.getElementById('lGenderLabel').textContent = t('genderLabel');
  document.getElementById('lOptional').textContent = t('optional');
  document.getElementById('wordInput').placeholder = t('placeholder');
  document.getElementById('meaningInput').placeholder = t('meaningPlaceholder');
  document.getElementById('lAddBtn').textContent = t('addBtn');
  document.getElementById('lM').textContent = t('m');
  document.getElementById('lF').textContent = t('f');
  document.getElementById('lN').textContent = t('n');
  document.getElementById('lWordList').textContent = t('wordList');
  const wlTitle = document.getElementById('lWordListTitle');
  if (wlTitle) wlTitle.textContent = t('wordList');
  const wlSearch = document.getElementById('wlSearch');
  if (wlSearch) wlSearch.placeholder = t('searchPlaceholder');
  document.getElementById('lEditTitle').textContent = t('editTitle');
  document.getElementById('lEditWordLabel').textContent = t('wordLabel');
  document.getElementById('lEditMeaningLabel').textContent = t('meaningLabel');
  document.getElementById('lEditGenderLabel').textContent = t('genderLabel');
  document.getElementById('lEgM').textContent = t('m');
  document.getElementById('lEgF').textContent = t('f');
  document.getElementById('lEgN').textContent = t('n');
  document.getElementById('lEgNone').textContent = t('gNone');
  document.getElementById('editSave').textContent = t('save');
  resetDeleteBtn();
  updateNoneHint();
}

async function updateStats() {
  const el = document.getElementById('homeStats');
  try {
    const words = await api('GET', '/api/words');
    if (!words.length) { el.innerHTML = ''; return; }
    const tot = words.reduce((a, w) => a + w.test_count, 0);
    const cor = words.reduce((a, w) => a + w.correct_count, 0);
    const acc = tot === 0 ? null : Math.round(cor / tot * 100);
    const dueN = words.filter(w => !w.due_at || new Date(w.due_at) <= Date.now()).length;
    el.innerHTML = `<b>${words.length}</b> ${t('words')}`
      + (acc !== null ? `<span class="dot">·</span><b>${acc}%</b> ${t('accuracy')}` : '')
      + (dueN > 0 ? `<span class="dot">·</span><span class="due-badge"><b>${dueN}</b> ${t('due')}</span>` : '');
  } catch (e) {
    el.innerHTML = '';
  }
}

function updateNoneHint() {
  const hint = document.getElementById('noneHint');
  if (!hint) return;
  hint.textContent = selGender ? '' : t('noneHint');
}

// ── Quiz ──────────────────────────────────────────────
let qDir = 'sk'; // 'sk' = 스페인어→한국어, 'ks' = 한국어→스페인어

function startQuiz() {
  go('quiz');
  loadQuiz();
}

async function loadQuiz() {
  qAnswered = false;
  qWord = null;
  document.getElementById('quizBody').innerHTML = '';
  qDir = Math.random() < 0.5 ? 'sk' : 'ks';
  try {
    qWord = await api('GET', '/api/quiz/pick');
  } catch (e) {
    qWord = null;
  }
  renderQuiz();
}

function renderQuiz() {
  const el = document.getElementById('quizBody');

  if (!qWord) {
    el.innerHTML = `<div class="empty-quiz">${t('noWords').replace('\n', '<br>')}</div>`;
    return;
  }

  const isSK = qDir === 'sk';
  const displayWord = isSK ? qWord.word : qWord.meaning;
  const dirLabel = isSK ? t('dirSK') : t('dirKS');
  const placeholder = isSK ? t('answerSK') : t('answerKS');
  const genderLabel = qWord.gender !== 'none' ? t(qWord.gender) : '';
  const isSpanishDisplay = isSK;

  const meta = qWord.test_count > 0
    ? `<b>${qWord.test_count}</b> ${t('tested')} · <b>${qWord.correct_count}</b> ${t('correctN')}`
    : '—';

  el.innerHTML = `
    ${qWord.due === false ? `<div class="practice-note">${t('reviewDone')}</div>` : ''}
    <div class="word-card" id="qCard">
      <div class="quiz-dir">${dirLabel}</div>
      <div class="quiz-word${isSpanishDisplay ? '' : ' quiz-word-kr'}">${displayWord}</div>
      ${genderLabel ? `<div class="gender-badge">${genderLabel}</div>` : ''}
      <div class="word-meta">${meta}</div>
    </div>
    <div class="answer-row">
      <input class="answer-input" id="answerInput" type="text"
             placeholder="${placeholder}" autocomplete="off" spellcheck="false">
      <button class="submit-btn" id="submitBtn" onclick="checkAnswer()">→</button>
    </div>
    <div class="quiz-fb" id="qFb"></div>
    <div class="correct-reveal" id="correctReveal">
      <span class="reveal-label" id="revealLabel">${t('correctAnswer')}</span>
      <span class="reveal-word" id="revealWord"></span>
    </div>
    <button class="next-btn" id="nextBtn" onclick="startQuiz()">${t('next')}</button>
  `;

  const input = document.getElementById('answerInput');
  input.focus();
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.stopPropagation(); // 같은 Enter가 문서 레벨의 '다음 문제' 핸들러까지 올라가지 않게
      checkAnswer();
    }
  });
  addAccentShortcut(input);
}

let wlCache = {};

function wlItemHTML(w) {
  const g = w.gender !== 'none'
    ? ` <span class="gender-badge" style="font-size:9px;padding:2px 7px">${t(w.gender)}</span>`
    : '';
  const stat = w.test_count > 0
    ? `${w.test_count} ${t('tested')} · ${w.correct_count} ${t('correctN')}`
    : '—';
  return `
    <div class="wl-left">
      <div class="wl-word">${w.word}${g}</div>
      <div class="wl-meaning">${w.meaning}</div>
    </div>
    <div class="wl-right">
      <div class="wl-stat">${stat}</div>
      <span class="wl-edit-glyph">✎</span>
    </div>`;
}

// ── Edit sheet ────────────────────────────────────────
let editTarget = null;
let editGender = 'none';
let deleteTimer = null;

function openEditSheet(word) {
  const w = wlCache[word];
  if (!w) return;
  editTarget = word;
  document.getElementById('editWord').value = w.word;
  document.getElementById('editMeaning').value = w.meaning;
  pickEditGender(w.gender);
  resetDeleteBtn();
  document.getElementById('editMsg').textContent = '';
  history.pushState({ view: curView, sheet: true }, '');
  document.getElementById('editSheet').classList.add('open');
  document.getElementById('sheetOverlay').classList.add('open');
}

function doCloseSheet() {
  editTarget = null;
  clearTimeout(deleteTimer);
  document.getElementById('editSheet').classList.remove('open');
  document.getElementById('sheetOverlay').classList.remove('open');
}

// 히스토리를 한 칸 되감아 닫음 → popstate에서 doCloseSheet 실행
function closeEditSheet() {
  if (document.getElementById('editSheet').classList.contains('open')) history.back();
}

function pickEditGender(g) {
  editGender = g;
  ['m', 'f', 'n', 'none'].forEach(x =>
    document.getElementById('eg-' + x).classList.toggle('on', x === g)
  );
}

function findWlItem(word) {
  return [...document.querySelectorAll('#wlBody .wl-item')]
    .find(item => item.dataset.word === word);
}

async function saveEditSheet() {
  if (!editTarget) return;
  const newWord = document.getElementById('editWord').value.trim().toLowerCase();
  const meaning = document.getElementById('editMeaning').value.trim();
  const msg = document.getElementById('editMsg');
  if (!newWord || !meaning) return;
  try {
    await api('PUT', `/api/words/${encodeURIComponent(editTarget)}`, { word: newWord, gender: editGender, meaning });
    const updated = { ...wlCache[editTarget], word: newWord, gender: editGender, meaning };
    const item = findWlItem(editTarget);
    delete wlCache[editTarget];
    wlCache[newWord] = updated;
    if (item) {
      item.dataset.word = newWord;
      item.innerHTML = wlItemHTML(updated);
    }
    closeEditSheet();
  } catch (err) {
    msg.style.color = 'var(--rust)';
    msg.textContent = err.detail === 'duplicate' ? t('duplicate') : (err.detail || '!');
    setTimeout(() => { msg.textContent = ''; }, 2000);
  }
}

function resetDeleteBtn() {
  const b = document.getElementById('editDelete');
  b.classList.remove('armed');
  b.textContent = t('delete');
}

async function deleteFromSheet() {
  if (!editTarget) return;
  const b = document.getElementById('editDelete');
  if (!b.classList.contains('armed')) {
    b.classList.add('armed');
    b.textContent = t('confirmDelete');
    clearTimeout(deleteTimer);
    deleteTimer = setTimeout(resetDeleteBtn, 3000);
    return;
  }
  clearTimeout(deleteTimer);
  try {
    await api('DELETE', `/api/words/${encodeURIComponent(editTarget)}`);
    const item = findWlItem(editTarget);
    delete wlCache[editTarget];
    if (item) item.remove();
    closeEditSheet();
    if (!Object.keys(wlCache).length) {
      document.getElementById('wlBody').innerHTML =
        `<div class="empty-quiz">${t('noWords').replace('\n', '<br>')}</div>`;
    }
    filterWordList();
  } catch (e) {
    resetDeleteBtn();
  }
}

// 악센트 무시 비교용: dónde → donde, español → espanol
const deaccent = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function filterWordList() {
  const q = deaccent(document.getElementById('wlSearch').value.trim().toLowerCase());
  let shown = 0;
  const total = Object.keys(wlCache).length;
  document.querySelectorAll('#wlBody .wl-item').forEach(item => {
    const w = wlCache[item.dataset.word];
    const match = !q || deaccent(w.word).includes(q) || deaccent(w.meaning.toLowerCase()).includes(q);
    item.style.display = match ? '' : 'none';
    if (match) shown++;
  });
  const countEl = document.getElementById('wlCount');
  countEl.textContent = q
    ? `${shown} / ${total} ${t('words')}`
    : `${total} ${t('words')}`;
}

function startWordList() {
  go('wordList');
  loadWordListBody();
}

async function loadWordListBody() {
  const body = document.getElementById('wlBody');
  const countEl = document.getElementById('wlCount');
  const searchEl = document.getElementById('wlSearch');
  searchEl.value = '';
  searchEl.oninput = filterWordList;
  wlCache = {};
  try {
    const words = await api('GET', '/api/words');
    words.forEach(w => { wlCache[w.word] = w; });
    countEl.textContent = `${words.length} ${t('words')}`;
    if (!words.length) {
      body.innerHTML = `<div class="empty-quiz">${t('noWords').replace('\n', '<br>')}</div>`;
      return;
    }
    body.innerHTML = words.map(w =>
      `<div class="wl-item" data-word="${w.word}" onclick="openEditSheet(this.dataset.word)">${wlItemHTML(w)}</div>`
    ).join('');
    // 터치 기기에서는 자동 포커스 시 키보드가 바로 올라와 목록을 가림
    if (matchMedia('(hover: hover)').matches) searchEl.focus();
  } catch (e) {
    body.innerHTML = '';
    countEl.textContent = '';
  }
}

async function checkAnswer() {
  if (qAnswered || !qWord) return;
  const input = document.getElementById('answerInput');
  const userAnswer = input.value.trim();
  if (!userAnswer) return;

  qAnswered = true;
  const correctAnswer = qDir === 'sk' ? qWord.meaning : qWord.word;
  const alts = correctAnswer.split(',').map(s => s.trim().toLowerCase());
  const ua = userAnswer.toLowerCase();
  let ok = alts.includes(ua);

  // 스페인어 입력 방향: 악센트(ñ 포함)만 틀렸으면 정답 처리하되 올바른 표기를 안내
  let accentWord = null;
  if (!ok && qDir === 'ks') {
    accentWord = alts.find(a => deaccent(a) === deaccent(ua)) || null;
    if (accentWord) ok = true;
  }

  input.disabled = true;

  try {
    await api('POST', '/api/quiz/answer', { word: qWord.word, correct: ok });
  } catch (e) {}

  document.getElementById('qCard').classList.add(ok ? 'state-ok' : 'state-err');

  const fb = document.getElementById('qFb');
  fb.textContent = accentWord ? t('accentFb') : (ok ? t('correct') : t('wrong'));
  fb.className = 'quiz-fb ' + (ok ? 'ok' : 'err');

  if (!ok) {
    document.getElementById('revealWord').textContent = correctAnswer;
    document.getElementById('correctReveal').classList.add('show');
  } else if (accentWord) {
    document.getElementById('revealLabel').textContent = t('accentTitle');
    // 틀린 글자(악센트 자리)만 금색으로 강조
    document.getElementById('revealWord').innerHTML = accentWord.split('').map(ch =>
      deaccent(ch) !== ch ? `<span class="acc">${ch}</span>` : ch
    ).join('');
    document.getElementById('correctReveal').classList.add('accent', 'show');
  }

  document.getElementById('nextBtn').classList.add('show');
}

// ── Add Word ──────────────────────────────────────────
function pickGender(g) {
  if (selGender === g) {
    selGender = null;
    document.getElementById('g' + g).classList.remove('on');
  } else {
    selGender = g;
    ['m', 'f', 'n'].forEach(x =>
      document.getElementById('g' + x).classList.toggle('on', x === g)
    );
  }
  updateNoneHint();
  checkReady();
}

function checkReady() {
  const word = document.getElementById('wordInput').value.trim();
  const meaning = document.getElementById('meaningInput').value.trim();
  document.getElementById('addBtn').disabled = !(word && meaning);
}

document.getElementById('wordInput').addEventListener('input', checkReady);
document.getElementById('wordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('meaningInput').focus();
});
document.getElementById('meaningInput').addEventListener('input', checkReady);
document.getElementById('meaningInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('addBtn').click();
});

const SHORTCUTS = { KeyA: 'á', KeyE: 'é', KeyI: 'í', KeyO: 'ó', KeyU: 'ú', KeyN: 'ñ', Slash: '¿', Digit1: '¡' };
const SHORTCUTS_UPPER = { KeyA: 'Á', KeyE: 'É', KeyI: 'Í', KeyO: 'Ó', KeyU: 'Ú', KeyN: 'Ñ' };

function addAccentShortcut(input) {
  input.addEventListener('keydown', e => {
    if (!e.altKey) return;
    const char = (e.shiftKey && SHORTCUTS_UPPER[e.code]) || SHORTCUTS[e.code];
    if (!char) return;
    e.preventDefault();
    const s = input.selectionStart;
    input.value = input.value.slice(0, s) + char + input.value.slice(input.selectionEnd);
    input.setSelectionRange(s + 1, s + 1);
    if (input.id === 'wordInput') checkReady();
  });
}

async function addWord() {
  const word = document.getElementById('wordInput').value.trim().toLowerCase();
  if (!word) return;

  const gender = selGender ?? 'none';
  const meaning = document.getElementById('meaningInput').value.trim();
  const msg = document.getElementById('addMsg');

  try {
    await api('POST', '/api/words', { word, gender, meaning });

    document.getElementById('wordInput').value = '';
    document.getElementById('meaningInput').value = '';
    selGender = null;
    ['m', 'f', 'n'].forEach(x => document.getElementById('g' + x).classList.remove('on'));
    document.getElementById('addBtn').disabled = true;
    updateNoneHint();

    msg.style.color = 'var(--sage)';
    msg.textContent = t('added');
    setTimeout(() => { msg.textContent = ''; }, 2000);
  } catch (err) {
    msg.style.color = 'var(--rust)';
    msg.textContent = err.detail === 'duplicate' ? t('duplicate') : (err.detail || t('duplicate'));
    setTimeout(() => { msg.textContent = ''; }, 2000);
  }
}

// ── Init ──────────────────────────────────────────────
setLang(lang);
updateStats();
updateNoneHint();

// 새로고침 시 브라우저가 보존한 히스토리 상태로 화면 복원
if (history.state && history.state.view && history.state.view !== 'home') {
  loadView(history.state.view);
} else {
  history.replaceState({ view: 'home' }, '');
}
addAccentShortcut(document.getElementById('wordInput'));
addAccentShortcut(document.getElementById('editWord'));

document.getElementById('editWord').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('editMeaning').focus();
});
document.getElementById('editMeaning').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveEditSheet();
});

// 모바일 키보드 감지: 뷰포트가 크게 줄면 키보드가 열린 것으로 보고
// 퀴즈 카드를 압축한 뒤 화면 안으로 스크롤
if (window.visualViewport && matchMedia('(hover: none)').matches) {
  visualViewport.addEventListener('resize', () => {
    const kbOpen = visualViewport.height < screen.height * 0.72;
    document.body.classList.toggle('kb-open', kbOpen);
    if (kbOpen && curView === 'quiz' && !qAnswered) {
      const card = document.getElementById('qCard');
      if (card) {
        const top = card.getBoundingClientRect().top + window.scrollY - 60;
        window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      }
    }
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('editSheet').classList.contains('open')) closeEditSheet();
    else if (document.getElementById('drawer').classList.contains('open')) toggleDrawer();
    return;
  }
  // 정답 확인 후 Enter → 다음 문제
  if (e.key === 'Enter' && qAnswered
      && document.getElementById('vQuiz').classList.contains('active')
      && !document.getElementById('editSheet').classList.contains('open')) {
    startQuiz();
  }
});

// ── PWA ───────────────────────────────────────────────
// 서비스워커는 보안 컨텍스트(https 또는 localhost)에서만 등록 가능
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
