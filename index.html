<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>español</title>
  <meta name="theme-color" content="#e7ebea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d141a" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ─── Tokens ─────────────────────────────────────────
       Azulejo: 유약(glaze) 바탕 위의 타일. 두 안료가 문법성을 나타냄
       — 코발트 = el(남성), 카르민 = la(여성). */
    :root {
      --glaze:     #e7ebea;
      --glaze-2:   #dce2e1;
      --tile:      #fcfdfd;
      --tile-2:    #f1f5f4;
      --line:      #ccd6d5;
      --line-soft: #e0e7e6;
      --ink:       #101820;
      --ink-2:     #55636d;
      --ink-3:     #8a97a1;
      --cobalt:    #1d4ed8;
      --cobalt-2:  #2f63ee;
      --cobalt-w:  rgba(29, 78, 216, 0.09);
      --carmine:   #af322a;
      --carmine-w: rgba(175, 50, 42, 0.09);
      --pine:      #0f6349;
      --pine-w:    rgba(15, 99, 73, 0.10);
      --saffron:   #a06605;
      --saffron-w: rgba(160, 102, 5, 0.12);

      /* Fraunces는 스페인어 전용. 한글은 어느 스택에서든 Plex Sans KR로 떨어지게 해
         시스템 폰트 대체로 자간·크기가 들쭉날쭉해지는 것을 막는다 */
      --display: 'Fraunces', 'IBM Plex Sans KR', Georgia, serif;
      --sans: 'IBM Plex Sans KR', system-ui, -apple-system, sans-serif;
      --mono: 'IBM Plex Mono', 'IBM Plex Sans KR', ui-monospace, monospace;

      --r: 4px;
      --shadow:    0 1px 2px rgba(16, 24, 32, 0.05), 0 3px 10px rgba(16, 24, 32, 0.05);
      --shadow-md: 0 1px 3px rgba(16, 24, 32, 0.07), 0 8px 22px rgba(16, 24, 32, 0.09);
      --shadow-lg: 0 2px 6px rgba(16, 24, 32, 0.09), 0 18px 40px rgba(16, 24, 32, 0.14);

      --topbar-h: 54px;
      --tabs-h: 60px;
      --col: 420px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --glaze:     #0d141a;
        --glaze-2:   #070c11;
        --tile:      #151e27;
        --tile-2:    #1c2832;
        --line:      #2a3945;
        --line-soft: #222f3a;
        --ink:       #e9eff2;
        --ink-2:     #9aa9b4;
        --ink-3:     #6a7a86;
        --cobalt:    #7ba4ff;
        --cobalt-2:  #9dbcff;
        --cobalt-w:  rgba(123, 164, 255, 0.15);
        --carmine:   #f0796a;
        --carmine-w: rgba(240, 121, 106, 0.15);
        --pine:      #4fc79b;
        --pine-w:    rgba(79, 199, 155, 0.15);
        --saffron:   #e4ac4e;
        --saffron-w: rgba(228, 172, 78, 0.15);
        --shadow:    0 1px 2px rgba(0, 0, 0, 0.5), 0 3px 10px rgba(0, 0, 0, 0.35);
        --shadow-md: 0 1px 3px rgba(0, 0, 0, 0.5), 0 8px 22px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 2px 6px rgba(0, 0, 0, 0.6), 0 18px 40px rgba(0, 0, 0, 0.55);
      }
    }

    body {
      font-family: var(--sans);
      font-weight: 400;
      background: var(--glaze);
      color: var(--ink);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      padding:
        calc(env(safe-area-inset-top, 0px) + var(--topbar-h) + 18px)
        16px
        calc(env(safe-area-inset-bottom, 0px) + var(--tabs-h) + 24px);
    }

    :focus-visible {
      outline: 2px solid var(--cobalt);
      outline-offset: 2px;
      border-radius: 2px;
    }

    button, input, a { font-family: inherit; }

    /* ─── Cenefa ─────────────────────────────────────────
       세비야 타일 테두리 문양. 앱의 유일한 장식 — 상단 바 밑단에만 씀 */
    .cenefa {
      height: 10px;
      background:
        repeating-conic-gradient(from 45deg, var(--cobalt) 0% 25%, transparent 0% 50%)
        0 0 / 10px 10px;
      opacity: 0.28;
    }

    /* ─── Top bar ────────────────────────────────────────── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 40;
      background: color-mix(in srgb, var(--glaze) 88%, transparent);
      backdrop-filter: blur(12px);
      padding-top: env(safe-area-inset-top, 0px);
    }
    .topbar-in {
      height: var(--topbar-h);
      max-width: var(--col);
      margin: 0 auto;
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      background: none; border: none; cursor: pointer;
      font-family: var(--display);
      font-optical-sizing: auto;
      font-size: 25px;
      font-weight: 600;
      letter-spacing: -0.005em;
      color: var(--ink);
      padding: 6px 8px;
      line-height: 1;
    }
    .wordmark .n { color: var(--cobalt); }

    .settings-btn {
      width: 38px; height: 38px;
      background: none;
      border: 1px solid transparent;
      color: var(--ink-3);
      cursor: pointer;
      display: grid; place-items: center;
      border-radius: var(--r);
      transition: color 0.18s, border-color 0.18s, background 0.18s;
    }
    .settings-btn:hover { color: var(--cobalt); border-color: var(--line); background: var(--tile); }

    /* ─── Tab bar ────────────────────────────────────────── */
    .tabs {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 40;
      display: flex;
      justify-content: center;
      gap: 2px;
      background: color-mix(in srgb, var(--glaze) 90%, transparent);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--line-soft);
      padding: 0 6px env(safe-area-inset-bottom, 0px);
    }
    .tab {
      position: relative;
      flex: 1 1 0;
      max-width: 96px;
      height: var(--tabs-h);
      background: none; border: none;
      cursor: pointer;
      color: var(--ink-3);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.01em;
      white-space: nowrap;
      border-radius: var(--r);
      transition: color 0.16s;
    }
    .tab svg { display: block; }
    .tab:hover { color: var(--ink-2); }
    .tab.on { color: var(--cobalt); }
    /* 활성 탭 위의 코발트 마커 */
    .tab.on::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 22px; height: 2px;
      background: var(--cobalt);
      border-radius: 0 0 2px 2px;
    }

    /* ─── Column & views ─────────────────────────────────── */
    /* margin auto: 내용이 짧으면 세로 가운데, 길면 위에서부터 자연스럽게 스크롤 */
    .app { width: 100%; max-width: var(--col); margin: auto; }

    .view { display: none; animation: rise 0.26s ease both; }
    .view.active { display: block; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .view-title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--ink);
      margin-bottom: 18px;
    }

    /* ─── HOME: 덱 ───────────────────────────────────────
       시그니처. 복습할 단어가 많을수록 타일이 실제로 두껍게 쌓임 */
    .home-kicker {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 22px;
    }

    .deck {
      /* --layers는 JS가 복습할 단어 수에 맞춰 설정 — 아래 여백이 쌓인 두께가 된다 */
      --layers: 0;
      position: relative;
      display: block;
      width: 100%;
      margin-bottom: 32px;
      background: none;
      border: none;
      padding: 0 0 calc(var(--layers) * 8px);
      cursor: pointer;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }

    .deck-layer {
      position: absolute;
      left: calc(var(--i) * 9px);
      right: calc(var(--i) * 9px);
      top: calc(var(--i) * 8px);
      bottom: calc(var(--layers) * 8px - var(--i) * 8px);
      background: var(--tile);
      border: 1px solid var(--line-soft);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      transition: transform 0.28s cubic-bezier(0.34, 1.2, 0.64, 1);
    }

    .deck-face {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px 24px 34px;
      background: var(--tile);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow-md);
      transition: transform 0.28s cubic-bezier(0.34, 1.2, 0.64, 1), box-shadow 0.28s;
    }
    /* azulejo 특유의 이중 헤어라인 */
    .deck-face::before {
      content: '';
      position: absolute;
      inset: 7px;
      border: 1px solid var(--line-soft);
      border-radius: 2px;
      pointer-events: none;
    }

    .deck:hover .deck-face { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .deck:hover .deck-layer { transform: translateY(-1px); }
    .deck:active .deck-face { transform: translateY(0); }

    .emblem {
      font-family: var(--display);
      font-optical-sizing: auto;
      font-size: 46px;
      font-weight: 600;
      line-height: 1;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .emblem .el { color: var(--cobalt); }
    .emblem .la { color: var(--carmine); }
    .emblem .slash { color: var(--ink-3); font-size: 26px; font-weight: 400; }

    .deck-count {
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-2);
      line-height: 1.4;
    }
    .deck-count b { color: var(--ink); font-weight: 600; }

    .deck-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px;
      background: var(--cobalt);
      color: #fff;
      border-radius: var(--r);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: background 0.18s;
    }
    .deck:hover .deck-cta { background: var(--cobalt-2); }
    .deck-cta .arr { transition: transform 0.2s; }
    .deck:hover .deck-cta .arr { transform: translateX(3px); }

    @media (prefers-color-scheme: dark) {
      .deck-cta { color: #0d141a; }
    }

    /* 칩: 새 단어 / 어려운 단어 */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .chip {
      flex: 1 1 auto;
      padding: 12px 16px;
      background: var(--tile);
      border: 1px solid var(--line-soft);
      border-radius: var(--r);
      color: var(--ink-2);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      box-shadow: var(--shadow);
      transition: border-color 0.18s, color 0.18s, transform 0.18s;
    }
    .chip:hover { border-color: var(--cobalt); color: var(--ink); transform: translateY(-1px); }
    .chip.hard:hover { border-color: var(--saffron); }

    .home-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-3);
    }
    .home-stats b { color: var(--ink-2); font-weight: 500; }
    .home-stats .streak { color: var(--saffron); }
    .home-stats .streak b { color: var(--saffron); }

    /* ─── QUIZ ───────────────────────────────────────────── */
    .practice-note {
      font-size: 12px;
      font-weight: 500;
      color: var(--pine);
      background: var(--pine-w);
      border-radius: var(--r);
      padding: 9px 13px;
      margin-bottom: 12px;
    }
    .practice-note.hard { color: var(--saffron); background: var(--saffron-w); }

    .word-card {
      position: relative;
      background: var(--tile);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow-md);
      padding: 30px 22px 24px;
      text-align: center;
      margin-bottom: 16px;
      transition: border-color 0.3s, background 0.3s;
    }
    .word-card::before {
      content: '';
      position: absolute;
      inset: 7px;
      border: 1px solid var(--line-soft);
      border-radius: 2px;
      pointer-events: none;
    }
    .word-card.state-ok  { border-color: var(--pine); background: var(--pine-w); }
    .word-card.state-err { border-color: var(--carmine); background: var(--carmine-w); }
    .word-card.state-ok::before  { border-color: color-mix(in srgb, var(--pine) 26%, transparent); }
    .word-card.state-err::before { border-color: color-mix(in srgb, var(--carmine) 26%, transparent); }

    .quiz-dir {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 22px;
    }

    .quiz-word {
      font-family: var(--display);
      font-optical-sizing: auto;
      font-size: clamp(36px, 11vw, 52px);
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -0.015em;
      color: var(--ink);
      overflow-wrap: break-word;
    }
    .quiz-word-kr {
      font-family: var(--sans);
      font-size: clamp(27px, 8vw, 36px);
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .word-meta {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.02em;
      color: var(--ink-3);
      margin-top: 14px;
    }
    .word-meta b { color: var(--ink-2); font-weight: 500; }

    .gender-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 3px 10px;
      border-radius: 100px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--ink-2);
      background: var(--tile-2);
      border: 1px solid var(--line-soft);
    }
    /* 성 안료를 배지에도 적용 — el/la 드릴에서는 배지를 숨기므로 정답이 새지 않음 */
    .gender-badge[data-g="m"] {
      color: var(--cobalt);
      background: var(--cobalt-w);
      border-color: color-mix(in srgb, var(--cobalt) 32%, transparent);
    }
    .gender-badge[data-g="f"] {
      color: var(--carmine);
      background: var(--carmine-w);
      border-color: color-mix(in srgb, var(--carmine) 32%, transparent);
    }

    /* 답 입력 */
    .answer-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .answer-input {
      flex: 1; min-width: 0;
      padding: 15px 16px;
      background: var(--tile);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 16px;
      outline: none;
      border-radius: var(--r);
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    .answer-input::placeholder { color: var(--ink-3); }
    .answer-input:focus { border-color: var(--cobalt); box-shadow: 0 0 0 3px var(--cobalt-w); }
    .answer-input:disabled { opacity: 0.65; }

    .submit-btn {
      flex: 0 0 58px;
      background: var(--cobalt);
      border: 1px solid var(--cobalt);
      color: #fff;
      cursor: pointer;
      font-size: 17px;
      border-radius: var(--r);
      transition: background 0.18s, opacity 0.18s;
    }
    .submit-btn:hover:not(:disabled) { background: var(--cobalt-2); }
    .submit-btn:disabled { opacity: 0.35; cursor: default; }

    .quiz-fb {
      font-size: 13px;
      font-weight: 600;
      min-height: 20px;
      text-align: center;
    }
    .quiz-fb.ok  { color: var(--pine); }
    .quiz-fb.err { color: var(--carmine); }

    .correct-reveal {
      display: none;
      margin-top: 10px;
      padding: 14px 16px;
      background: var(--carmine-w);
      border-left: 3px solid var(--carmine);
      border-radius: 0 var(--r) var(--r) 0;
      color: var(--ink);
      animation: rise 0.2s ease both;
    }
    .correct-reveal.show { display: block; }
    .correct-reveal .reveal-label {
      display: block;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--carmine);
      margin-bottom: 5px;
    }
    .correct-reveal .reveal-word {
      font-family: var(--display);
      font-optical-sizing: auto;
      font-size: 24px;
      font-weight: 600;
    }

    /* 악센트만 틀림: 정답 처리하되 올바른 표기를 각인 */
    .correct-reveal.accent { background: var(--saffron-w); border-left-color: var(--saffron); }
    .correct-reveal.accent .reveal-label { color: var(--saffron); }
    .reveal-word .acc { color: var(--saffron); }

    /* 맞혔지만 다른 뜻도 있을 때 */
    .correct-reveal.also { background: var(--pine-w); border-left-color: var(--pine); }
    .correct-reveal.also .reveal-label { color: var(--pine); }
    .correct-reveal.also .reveal-word {
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 500;
    }

    .next-btn {
      display: none;
      width: 100%;
      margin-top: 12px;
      padding: 16px;
      background: var(--cobalt);
      border: 1px solid var(--cobalt);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--r);
      transition: background 0.18s;
    }
    .next-btn.show { display: block; animation: rise 0.22s ease both; }
    .next-btn:hover { background: var(--cobalt-2); }

    @media (prefers-color-scheme: dark) {
      .submit-btn, .next-btn { color: #0d141a; }
    }

    .empty-quiz {
      text-align: center;
      padding: 56px 0;
      font-size: 14px;
      color: var(--ink-2);
      line-height: 2;
    }

    /* ─── TTS ────────────────────────────────────────────── */
    .tts-btn {
      background: none; border: none;
      color: var(--cobalt);
      cursor: pointer;
      padding: 8px;
      border-radius: var(--r);
      transition: background 0.16s, transform 0.1s;
    }
    .tts-btn:hover { background: var(--cobalt-w); }
    .tts-btn:active { transform: scale(0.9); }
    .tts-btn.sm { padding: 2px 4px; vertical-align: middle; }
    .tts-btn.sm svg { width: 13px; height: 13px; }
    body.no-tts .tts-btn, body.no-tts .play-btn { display: none; }

    .play-btn {
      width: 78px; height: 78px;
      margin-top: 4px;
      border-radius: 50%;
      background: var(--cobalt);
      border: none;
      color: #fff;
      font-size: 24px;
      text-indent: 4px;
      cursor: pointer;
      display: inline-grid; place-items: center;
      box-shadow: var(--shadow-md);
      transition: background 0.18s, transform 0.12s;
    }
    .play-btn:hover { background: var(--cobalt-2); }
    .play-btn:active { transform: scale(0.94); }

    .listen-hint {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-top: 14px;
    }

    /* ─── CLOZE ──────────────────────────────────────────── */
    .cloze-text {
      font-family: var(--display);
      font-optical-sizing: auto;
      font-size: clamp(21px, 6vw, 26px);
      font-weight: 400;
      line-height: 1.6;
      overflow-wrap: break-word;
    }
    .cloze-blank {
      display: inline-block;
      min-width: 68px;
      border-bottom: 2px solid var(--cobalt);
      margin: 0 3px;
    }
    .cloze-blank.filled {
      min-width: 0;
      border-bottom-color: transparent;
      color: var(--cobalt);
      font-weight: 600;
    }
    .cloze-hint {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-2);
    }
    .cloze-trans {
      margin-top: 10px;
      font-size: 13px;
      color: var(--pine);
      line-height: 1.6;
    }

    /* ─── el / la 드릴 ───────────────────────────────────── */
    .gender-answer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .g-opt.big {
      padding: 20px 12px;
      font-family: var(--display);
      font-optical-sizing: auto;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
      color: var(--ink);
    }
    /* 정답 단서를 주지 않도록, 답하기 전에는 두 버튼 모두 중립색 */
    .g-opt.right { border-color: var(--pine); color: var(--pine); background: var(--pine-w); }
    .g-opt.wrong { border-color: var(--carmine); color: var(--carmine); background: var(--carmine-w); }

    /* ─── STATS ──────────────────────────────────────────── */
    .stat-tiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-tile {
      background: var(--tile);
      border: 1px solid var(--line-soft);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 18px 8px 14px;
      text-align: center;
    }
    .stat-num {
      font-family: var(--display);
      font-optical-sizing: auto;
      font-size: 34px;
      font-weight: 600;
      line-height: 1.05;
      color: var(--cobalt);
    }
    .stat-num small { font-size: 16px; margin-left: 2px; color: var(--ink-3); font-weight: 400; }
    .stat-label {
      font-size: 11px;
      color: var(--ink-3);
      margin-top: 8px;
    }

    .chart-block {
      background: var(--tile);
      border: 1px solid var(--line-soft);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 18px 16px 14px;
      margin-bottom: 12px;
    }
    .chart-title {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 18px;
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 104px;
      border-bottom: 1px solid var(--line-soft);
    }
    .bar-col {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }
    .bar-fill {
      width: 100%;
      background: var(--cobalt);
      opacity: 0.32;
      border-radius: 2px 2px 0 0;
      transition: height 0.4s ease;
    }
    .bar-col.today .bar-fill { opacity: 1; }
    .bar-val { font-family: var(--mono); font-size: 9px; color: var(--ink-3); margin-bottom: 4px; }
    .bar-x-row {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--ink-3);
      margin-top: 7px;
    }

    .box-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .box-stage { width: 14px; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
    .box-track {
      flex: 1;
      height: 10px;
      background: var(--glaze-2);
      border-radius: 5px;
      overflow: hidden;
    }
    .box-fill {
      height: 100%;
      background: var(--cobalt);
      border-radius: 5px;
      transition: width 0.4s ease;
    }
    .box-count { width: 26px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
    .box-hint {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink-3);
      text-align: center;
      margin-top: 14px;
    }

    /* ─── FLASHCARDS ─────────────────────────────────────── */
    .flash-scene { perspective: 1000px; margin-bottom: 12px; cursor: pointer; }
    .flash-inner {
      position: relative;
      height: 260px;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .flash-inner.flipped { transform: rotateY(180deg); }
    .flash-face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--tile);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow-md);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }
    .flash-face::before {
      content: '';
      position: absolute;
      inset: 7px;
      border: 1px solid var(--line-soft);
      border-radius: 2px;
    }
    .flash-face.back { transform: rotateY(180deg); background: var(--tile-2); }
    .flash-word {
      font-family: var(--display);
      font-optical-sizing: auto;
      font-size: clamp(34px, 10vw, 44px);
      font-weight: 600;
      letter-spacing: -0.015em;
      overflow-wrap: break-word;
      max-width: 100%;
    }
    .flash-meaning { font-size: 24px; font-weight: 500; letter-spacing: -0.02em; }
    .flash-hint {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .flash-nav { display: flex; gap: 8px; }
    .flash-nav button {
      flex: 1;
      padding: 15px;
      background: var(--tile);
      border: 1px solid var(--line);
      color: var(--ink-2);
      cursor: pointer;
      font-size: 16px;
      border-radius: var(--r);
      box-shadow: var(--shadow);
      transition: border-color 0.18s, color 0.18s;
    }
    .flash-nav button:hover:not(:disabled) { border-color: var(--cobalt); color: var(--cobalt); }
    .flash-nav button:disabled { opacity: 0.3; cursor: default; }

    /* ─── FORMS ──────────────────────────────────────────── */
    .field { margin-bottom: 20px; }

    .field-label {
      display: flex; align-items: center; gap: 7px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 8px;
    }
    .field-label .optional {
      letter-spacing: 0.04em;
      text-transform: none;
      color: var(--ink-3);
      opacity: 0.8;
    }

    .word-input {
      width: 100%;
      padding: 13px 16px;
      background: var(--tile);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--display);
      font-optical-sizing: auto;
      font-size: 26px;
      font-weight: 600;
      outline: none;
      border-radius: var(--r);
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    .word-input::placeholder { color: var(--ink-3); font-weight: 400; }
    .word-input:focus { border-color: var(--cobalt); box-shadow: 0 0 0 3px var(--cobalt-w); }

    .meaning-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--tile);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 16px;
      outline: none;
      border-radius: var(--r);
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    .meaning-input::placeholder { color: var(--ink-3); }
    .meaning-input:focus { border-color: var(--cobalt); box-shadow: 0 0 0 3px var(--cobalt-w); }

    .gender-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .gender-pick.four { grid-template-columns: repeat(4, 1fr); }

    .g-opt {
      padding: 14px 6px;
      background: var(--tile);
      border: 1px solid var(--line-soft);
      color: var(--ink-2);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      border-radius: var(--r);
      box-shadow: var(--shadow);
      transition: border-color 0.18s, color 0.18s, background 0.18s;
    }
    .g-opt:hover { border-color: var(--ink-3); color: var(--ink); }
    .g-opt.on { border-color: var(--cobalt); color: var(--cobalt); background: var(--cobalt-w); }
    /* 성별 안료로 구분: 남성 = 코발트, 여성 = 카르민 */
    #gf.on, #eg-f.on { border-color: var(--carmine); color: var(--carmine); background: var(--carmine-w); }

    .none-hint {
      margin-top: 9px;
      font-size: 12px;
      color: var(--ink-3);
      text-align: center;
      min-height: 17px;
    }

    .add-btn {
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      background: var(--cobalt);
      border: 1px solid var(--cobalt);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--r);
      transition: background 0.18s, opacity 0.18s;
    }
    .add-btn:hover:not(:disabled) { background: var(--cobalt-2); }
    .add-btn:disabled { opacity: 0.32; cursor: default; }

    @media (prefers-color-scheme: dark) {
      .add-btn, .play-btn { color: #0d141a; }
    }

    .add-msg {
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      min-height: 19px;
      margin-top: 12px;
    }

    .shortcut-hint {
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink-3);
    }
    .shortcut-hint kbd {
      display: inline-block;
      padding: 1px 5px;
      background: var(--tile-2);
      border: 1px solid var(--line);
      border-radius: 3px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink-2);
    }

    .delete-btn {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      background: none;
      border: 1px solid transparent;
      color: var(--carmine);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--r);
      transition: border-color 0.18s, background 0.18s;
    }
    .delete-btn:hover { background: var(--carmine-w); }
    .delete-btn.armed { border-color: var(--carmine); background: var(--carmine-w); }

    /* ─── WORD LIST ──────────────────────────────────────── */
    .wl-search {
      width: 100%;
      padding: 13px 16px;
      background: var(--tile);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 16px;
      outline: none;
      border-radius: var(--r);
      transition: border-color 0.18s, box-shadow 0.18s;
      margin-bottom: 10px;
    }
    .wl-search::placeholder { color: var(--ink-3); }
    .wl-search:focus { border-color: var(--cobalt); box-shadow: 0 0 0 3px var(--cobalt-w); }

    .wl-count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-3);
      margin-bottom: 12px;
    }

    .wl-item {
      position: relative;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 13px 14px 13px 17px;
      background: var(--tile);
      border: 1px solid var(--line-soft);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      margin-bottom: 6px;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
    }
    .wl-item:hover { border-color: var(--ink-3); transform: translateX(2px); }

    /* 성 안료 표시: 항목 왼쪽 세로 잉크 바 */
    .wl-ink {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--ink-3);
    }
    .wl-ink[data-g="m"] { background: var(--cobalt); }
    .wl-ink[data-g="f"] { background: var(--carmine); }
    .wl-ink[data-g="n"] { background: linear-gradient(var(--cobalt) 50%, var(--carmine) 50%); }
    .wl-ink[data-g="none"] { background: var(--line); }

    .wl-left { flex: 1; min-width: 0; }
    .wl-word {
      font-family: var(--display);
      font-optical-sizing: auto;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
      line-height: 1.2;
    }
    /* 관사를 단어와 함께 노출해 성을 자연스럽게 익히게 함 */
    .art { font-weight: 400; color: var(--ink-3); }
    .art[data-g="m"] { color: var(--cobalt); }
    .art[data-g="f"] { color: var(--carmine); }
    .wl-meaning { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
    .wl-right { flex-shrink: 0; text-align: right; }
    .wl-stat { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
    .wl-edit-glyph { display: block; margin-top: 6px; font-size: 12px; color: var(--ink-3); }
    .wl-item:hover .wl-edit-glyph { color: var(--cobalt); }

    /* ─── OVERLAY / DRAWER / SHEET ───────────────────────── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(8, 14, 20, 0.34);
      opacity: 0; pointer-events: none;
      transition: opacity 0.28s;
      z-index: 50;
      backdrop-filter: blur(2px);
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    #sheetOverlay { z-index: 60; }

    .drawer {
      position: fixed;
      top: 0; right: 0;
      width: 280px; max-width: 84vw;
      height: 100dvh;
      background: var(--tile);
      border-left: 1px solid var(--line);
      box-shadow: var(--shadow-lg);
      padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px 24px;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 51;
      overflow-y: auto;
    }
    .drawer.open { transform: translateX(0); }

    .drawer-head, .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .drawer-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    .close-btn {
      background: none; border: none;
      color: var(--ink-3); cursor: pointer;
      font-size: 24px; line-height: 1;
      padding: 4px 8px;
      border-radius: var(--r);
      transition: color 0.18s, background 0.18s;
    }
    .close-btn:hover { color: var(--ink); background: var(--tile-2); }

    .drawer-section-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 10px;
    }

    .lang-list { display: flex; flex-direction: column; gap: 2px; }

    .lang-btn {
      padding: 12px 13px;
      background: none;
      border: 1px solid transparent;
      color: var(--ink-2);
      cursor: pointer;
      font-size: 14px;
      text-align: left;
      display: flex; align-items: center; gap: 11px;
      border-radius: var(--r);
      text-decoration: none;
      transition: color 0.18s, background 0.18s;
    }
    .lang-btn:hover { color: var(--ink); background: var(--tile-2); }
    .lang-btn.on { color: var(--cobalt); background: var(--cobalt-w); font-weight: 500; }

    .lang-pip {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--line); flex-shrink: 0;
      transition: background 0.18s;
    }
    .lang-btn.on .lang-pip { background: var(--cobalt); }

    .sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: var(--tile);
      border-top: 1px solid var(--line);
      border-radius: 14px 14px 0 0;
      box-shadow: var(--shadow-lg);
      padding: 20px 20px calc(env(safe-area-inset-bottom, 0px) + 22px);
      max-height: 90dvh;
      overflow-y: auto;
      transform: translateY(105%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 61;
    }
    .sheet.open { transform: translateY(0); }
    /* 바텀시트 손잡이 */
    .sheet::before {
      content: '';
      position: absolute;
      top: 8px; left: 50%;
      transform: translateX(-50%);
      width: 36px; height: 4px;
      border-radius: 2px;
      background: var(--line);
    }

    /* ─── 데스크톱 ───────────────────────────────────────── */
    @media (min-width: 601px) {
      body { padding-left: 24px; padding-right: 24px; }

      .tabs {
        left: 50%;
        right: auto;
        bottom: 20px;
        transform: translateX(-50%);
        border: 1px solid var(--line-soft);
        border-radius: 100px;
        background: color-mix(in srgb, var(--tile) 92%, transparent);
        box-shadow: var(--shadow-md);
        padding: 0 8px;
      }
      /* 알약형 바에서는 상단 마커 대신 배경 강조가 자연스러움 */
      .tabs { gap: 4px; padding: 6px 8px; }
      .tab { flex: 0 0 auto; max-width: none; min-width: 74px; height: 52px; border-radius: 100px; }
      .tab.on { background: var(--cobalt-w); }
      .tab.on::before { display: none; }

      .sheet {
        left: 50%; right: auto; bottom: auto; top: 50%;
        width: var(--col); max-height: 86vh;
        border: 1px solid var(--line);
        border-radius: 8px;
        transform: translate(-50%, -46%);
        opacity: 0; pointer-events: none;
        transition: opacity 0.2s, transform 0.2s;
      }
      .sheet.open { transform: translate(-50%, -50%); opacity: 1; pointer-events: all; }
      .sheet::before { display: none; }
    }

    /* 터치 기기에서는 alt 단축키 안내가 쓸모없음 */
    @media (hover: none) {
      .shortcut-hint { display: none; }
    }

    /* 모바일 키보드가 열리면 퀴즈 카드를 압축해 가려지지 않게 함 */
    @media (max-width: 600px) {
      body.kb-open { padding-bottom: 24px; }
      body.kb-open .tabs { display: none; }
      body.kb-open .practice-note,
      body.kb-open .word-meta { display: none; }
      body.kb-open .word-card { padding: 16px 16px 14px; margin-bottom: 12px; }
      body.kb-open .quiz-dir { margin-bottom: 10px; }
      body.kb-open .quiz-word { font-size: clamp(24px, 7vw, 32px); }
      body.kb-open .quiz-word-kr { font-size: clamp(20px, 6vw, 27px); }
      body.kb-open .gender-badge { margin-top: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-in">
      <button class="wordmark" onclick="tabGo('home')">espa<span class="n">ñ</span>ol</button>
      <button class="settings-btn" id="settingsBtn" onclick="toggleDrawer()" aria-label="설정">
        <!-- 세 줄 길이를 모두 같게 둬서 단어장 탭의 목록 아이콘과 구분되게 함 -->
        <svg width="19" height="19" viewBox="0 0 19 19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M3 5.5h13M3 9.5h13M3 13.5h13"/>
        </svg>
      </button>
    </div>
    <div class="cenefa"></div>
  </header>

  <div class="app">

    <!-- ── HOME ── -->
    <div class="view active" id="vHome">
      <p class="home-kicker" id="lSub">단어를 정복하라</p>
      <button class="deck" id="deck" onclick="deckAction()"></button>
      <div class="chips">
        <button class="chip" id="flashHomeBtn" style="display:none" onclick="startFlash()">
          <span id="lFlashHome"></span>
        </button>
        <button class="chip hard" id="hardHomeBtn" style="display:none" onclick="startQuizMode(true)">
          <span id="lHardHome"></span>
        </button>
      </div>
      <div class="home-stats" id="homeStats"></div>
    </div>

    <!-- ── QUIZ ── -->
    <div class="view" id="vQuiz">
      <div id="quizBody"></div>
    </div>

    <!-- ── WORD LIST ── -->
    <div class="view" id="vWordList">
      <h2 class="view-title" id="lWordListTitle">단어장</h2>
      <input class="wl-search" id="wlSearch" type="text" autocomplete="off" spellcheck="false">
      <p class="wl-count" id="wlCount"></p>
      <div class="wl-body" id="wlBody"></div>
    </div>

    <!-- ── FLASHCARDS ── -->
    <div class="view" id="vFlash">
      <h2 class="view-title" id="lFlashTitle">새 단어</h2>
      <p class="wl-count" id="flashCount"></p>
      <div id="flashBody"></div>
    </div>

    <!-- ── STATS ── -->
    <div class="view" id="vStats">
      <h2 class="view-title" id="lStatsTitle">학습 통계</h2>
      <div class="stat-tiles">
        <div class="stat-tile">
          <div class="stat-num" id="stStreak">0</div>
          <div class="stat-label" id="lStreak">연속 학습일</div>
        </div>
        <div class="stat-tile">
          <div class="stat-num" id="stToday">0</div>
          <div class="stat-label" id="lToday">오늘 학습</div>
        </div>
        <div class="stat-tile">
          <div class="stat-num" id="stAcc">—</div>
          <div class="stat-label" id="lAcc">전체 정답률</div>
        </div>
      </div>
      <div class="chart-block">
        <div class="chart-title" id="lDaily">최근 14일 학습량</div>
        <div class="bars" id="dailyBars"></div>
        <div class="bar-x-row" id="dailyXRow"></div>
      </div>

// ── API helper ────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  if (!res.ok) throw await res.json();
  return res.json();
}

// ── Helpers ───────────────────────────────────────────
const t = k => T[lang][k];

// ── View routing ──────────────────────────────────────
// 브라우저/핸드폰 뒤로가기와 연동: 화면 전환과 시트·서랍 열림을 히스토리에 기록
let curView = 'home';

function show(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('v' + view[0].toUpperCase() + view.slice(1)).classList.add('active');
  // 새 단어(flash)는 홈에서 들어가는 화면이라 홈 탭을 계속 켜 둠
  const tab = view === 'flash' ? 'home' : view;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.view === tab));
  curView = view;
  window.scrollTo(0, 0);
  renderTexts();
}

function go(view) {
  if (view !== curView) history.pushState({ view }, '');
  show(view);
}

// 탭 이동: 현재 화면이면 무시하고, 아니면 히스토리에 쌓은 뒤 해당 화면을 로드
function tabGo(view) {
  if (view === curView) return;
  if (view === 'quiz') qHard = false;
  history.pushState({ view }, '');
  loadView(view);
}

function loadView(view) {
  if (view === 'quiz') { show('quiz'); loadQuiz(); }
  else if (view === 'wordList') { show('wordList'); loadWordListBody(); }
  else if (view === 'stats') { show('stats'); loadStats(); }
  else if (view === 'flash') { show('flash'); loadFlash(); }
  else if (view === 'home') { updateStats(); show('home'); }
  else show(view);
}

window.addEventListener('popstate', e => {
  const st = e.state || { view: 'home' };
  const overlayWasOpen = document.getElementById('editSheet').classList.contains('open')
    || document.getElementById('drawer').classList.contains('open');
  doCloseSheet();
  doCloseDrawer();
  // 시트/서랍만 닫는 뒤로가기면 화면은 그대로 유지 (검색어·스크롤 보존)
  if (overlayWasOpen && st.view === curView && !st.sheet && !st.drawer) return;
  loadView(st.view || 'home');
});

// ── Settings drawer ───────────────────────────────────
function toggleDrawer() {
  if (document.getElementById('drawer').classList.contains('open')) {
    history.back();
    return;
  }
  history.pushState({ view: curView, drawer: true }, '');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function doCloseDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

function setLang(l) {
  lang = l;
  localStorage.setItem('lang', l);
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('on', b.id === 'btn-' + l)
  );
  renderTexts();
  // 덱과 홈 통계는 JS가 문구를 만들어 넣으므로 언어가 바뀌면 다시 그려야 한다

}

// 홈의 덱: 복습할 단어가 많을수록 타일이 실제로 두껍게 쌓인다
let deckMode = 'quiz';

function renderDeck(s) {
  const el = document.getElementById('deck');
  const empty = !s || !s.word_count;
  const due = empty ? 0 : s.due_count;
  deckMode = empty ? 'add' : 'quiz';

  const line = empty ? t('deckEmpty')
    : due > 0 ? t('deckDue').replace('{n}', due)
    : t('deckClear');
  const cta = empty ? t('deckAdd') : due > 0 ? t('deckGo') : t('deckFree');

  const layers = Math.min(due, 4);
  el.style.setProperty('--layers', layers);
  el.innerHTML =
    Array.from({ length: layers }, (_, k) =>
      `<span class="deck-layer" style="--i:${layers - k}"></span>`).join('')
    + `<span class="deck-face">
         <span class="emblem"><span class="el">el</span><span class="slash">/</span><span class="la">la</span></span>
         <span class="deck-count">${line}</span>
         <span class="deck-cta">${cta} <span class="arr">→</span></span>
       </span>`;
}

function deckAction() {
  if (deckMode === 'add') tabGo('addWord');
  else startQuizMode(false);
}

async function updateStats() {
  const el = document.getElementById('homeStats');
  let s = null;
  try {
    s = await api('GET', '/api/stats');
  } catch (e) {}
  renderDeck(s);
  if (!s || !s.word_count) {
    el.innerHTML = '';
    document.getElementById('flashHomeBtn').style.display = 'none';
    document.getElementById('hardHomeBtn').style.display = 'none';
    return;
  }
  const acc = s.test_total === 0 ? null : Math.round(s.correct_total / s.test_total * 100);
  el.innerHTML = `<span><b>${s.word_count}</b> ${t('words')}</span>`
    + (acc !== null ? `<span><b>${acc}%</b> ${t('accuracy')}</span>` : '')
    + (s.streak >= 2 ? `<span class="streak">${t('streakHome').replace('{n}', s.streak)}</span>` : '');
  document.getElementById('lFlashHome').textContent = `${t('flashBtn')} (${s.new_count})`;
  document.getElementById('flashHomeBtn').style.display = s.new_count > 0 ? '' : 'none';
  document.getElementById('lHardHome').textContent = `${t('hardBtn')} (${s.hard_count})`;
  document.getElementById('hardHomeBtn').style.display = s.hard_count > 0 ? '' : 'none';
}

// ── Flashcards (새 단어) ───────────────────────────────
let flashWords = [];
let flashIdx = 0;
let flashFlipped = false;

function startFlash() {
  go('flash');
  loadFlash();
}

async function loadFlash() {
  flashIdx = 0;
  flashFlipped = false;
  try {
    const words = await api('GET', '/api/words');
    flashWords = words.filter(w => w.test_count === 0);
  } catch (e) {
    flashWords = [];
  }
  renderFlash();
}

function renderFlash() {
  const el = document.getElementById('flashBody');
  const count = document.getElementById('flashCount');

  if (!flashWords.length) {
    count.textContent = '';
    el.innerHTML = `<div class="empty-quiz">${t('noWords').replace('\n', '<br>')}</div>`;
    return;
  }
  if (flashIdx >= flashWords.length) {
    count.textContent = '';
    el.innerHTML = `
      <div class="empty-quiz" style="padding:40px 0">${t('flashDone')}</div>
      <button class="add-btn" onclick="startQuiz()">${t('flashQuiz')}</button>`;
    return;
  }

  const w = flashWords[flashIdx];
  count.textContent = `${flashIdx + 1} / ${flashWords.length}`;
  const g = w.gender !== 'none' ? `<div class="gender-badge" data-g="${w.gender}">${t(w.gender)}</div>` : '';
  el.innerHTML = `
    <div class="flash-scene" onclick="flipFlash()">
      <div class="flash-inner" id="flashInner">
        <div class="flash-face">
          <div class="flash-word">${w.word}</div>
          ${g}
          <div class="flash-hint">${t('flashTapHint')}</div>
        </div>
        <div class="flash-face back">
          <div class="flash-meaning">${w.meaning}</div>
          ${g}
          <div class="flash-hint">${w.word}</div>
        </div>
      </div>
    </div>
    <div class="flash-nav">
      <button onclick="prevFlash()" ${flashIdx === 0 ? 'disabled' : ''}>←</button>
      <button class="tts-btn" style="flex:0 0 64px" onclick="speak(flashWords[flashIdx].word)">${TTS_ICON}</button>
      <button onclick="nextFlash()">→</button>
    </div>`;
  speak(w.word);
}

function flipFlash() {
  flashFlipped = !flashFlipped;
  document.getElementById('flashInner').classList.toggle('flipped', flashFlipped);
}

function nextFlash() {
  flashIdx++;
  flashFlipped = false;
  renderFlash();
}

function prevFlash() {
  if (flashIdx === 0) return;
  flashIdx--;
  flashFlipped = false;
  renderFlash();
}

const fmtDay = iso => `${+iso.slice(5, 7)}/${+iso.slice(8, 10)}`;

async function loadStats() {
  let s;
  try {
    s = await api('GET', '/api/stats');
  } catch (e) {
    return;
  }

  document.getElementById('stStreak').textContent = s.streak;
  document.getElementById('stToday').textContent = s.today_total;

    ? '—'
    : `${Math.round(s.correct_total / s.test_total * 100)}<small>%</small>`;

  // 최근 14일: 최대값과 오늘만 값 라벨 (선택적 라벨)

    return `<div class="box-row">

      <div class="box-track"><div class="box-fill" style="width:${Math.round(v / bmax * 100)}%"></div></div>

// ── TTS (발음) ─────────────────────────────────────────
const TTS_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M2.5 6v4h2.6L9 13.2V2.8L5.1 6z"/><path d="M11 5.7a3.2 3.2 0 0 1 0 4.6" stroke-linecap="round"/><path d="M12.9 3.9a5.8 5.8 0 0 1 0 8.2" stroke-linecap="round"/></svg>';

let esVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  esVoice = vs.find(v => v.lang === 'es-ES') || vs.find(v => v.lang && v.lang.startsWith('es')) || null;
  document.body.classList.toggle('no-tts', !esVoice);
}

function speak(text) {
  if (!esVoice) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = esVoice;
  u.lang = esVoice.lang;
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

if ('speechSynthesis' in window) {
  pickVoice();
  // 일부 브라우저는 음성 목록을 비동기로 로드함
  speechSynthesis.onvoiceschanged = pickVoice;
} else {
  document.body.classList.add('no-tts');
}

// ── Quiz ──────────────────────────────────────────────
let qDir = 'sk'; // 'sk' = 스페인어→한국어, 'ks' = 한국어→스페인어, 'listen' = 받아쓰기

let qHard = false; // 어려운 단어 집중 연습 모드

function startQuizMode(hard) {
  qHard = hard;
  startQuiz();
}

function startQuiz() {
  go('quiz');
  loadQuiz();
}

// 문제 로딩이 겹칠 수 있어(탭 연타 등) 토큰으로 최신 요청만 화면에 반영한다.
// 지역 변수에 모아 두었다가 마지막에 한 번에 커밋해야, 뒤처진 요청이
// qDir만 'cloze'로 바꿔 놓고 qSentence는 비어 있는 상태를 만들지 않는다.
let quizToken = 0;

async function loadQuiz() {
  const token = ++quizToken;
  qAnswered = false;
  qWord = null;
  qSentence = null;
  document.getElementById('quizBody').innerHTML = '';

  // 음성 지원 시 20%는 받아쓰기 문제
  const dirs = esVoice ? ['sk', 'sk', 'ks', 'ks', 'listen'] : ['sk', 'ks'];
  let dir = dirs[Math.floor(Math.random() * dirs.length)];

  let word;
  try {
    word = await api('GET', '/api/quiz/pick' + (qHard ? '?hard=1' : ''));
  } catch (e) {
    word = null;
  }
  if (token !== quizToken) return;

  // 성별 있는 명사는 25% 확률로 관사(el/la) 문제
  if (word && (word.gender === 'm' || word.gender === 'f') && Math.random() < 0.25) {
    dir = 'gender';
  }

  // 그 외에는 30% 확률로 예문 빈칸 문제 시도 (예문 없거나 느리면 원래 문제로)
  let sentence = null;
  if (word && dir !== 'gender' && Math.random() < 0.3) {
    sentence = await fetchSentence(word.word);
    if (token !== quizToken) return;
    if (sentence) dir = 'cloze';
  }

  qWord = word;
  qDir = dir;
  qSentence = sentence;
  renderQuiz();
}

let qSentence = null;

// 예문 조회: 첫 요청은 서버가 Tatoeba에서 수집하느라 느릴 수 있어 2.5초만 기다림
// (시간 초과로 넘어가도 서버는 수집을 마치고 캐시하므로 다음번엔 즉시 응답)
async function fetchSentence(word) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 2500);
  try {
    const res = await fetch(`/api/sentence/${encodeURIComponent(word)}`, { signal: ctrl.signal });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

async function answerGender(g) {
  if (qAnswered || !qWord) return;
  qAnswered = true;
  const ok = g === qWord.gender;
  const article = qWord.gender === 'm' ? 'el' : 'la';

  try {
    await api('POST', '/api/quiz/answer', { word: qWord.word, correct: ok });
  } catch (e) {}

  document.getElementById('qCard').classList.add(ok ? 'state-ok' : 'state-err');
  document.getElementById('ga-' + qWord.gender).classList.add('right');
  if (!ok) document.getElementById('ga-' + g).classList.add('wrong');

  const fb = document.getElementById('qFb');
  fb.textContent = ok ? t('correct') : t('wrong');
  fb.className = 'quiz-fb ' + (ok ? 'ok' : 'err');

  if (!ok) {
    document.getElementById('revealWord').textContent = `${article} ${qWord.word}`;
    document.getElementById('correctReveal').classList.add('show');
  }

  speak(`${article} ${qWord.word}`);
  document.getElementById('nextBtn').classList.add('show');
}

function renderQuiz() {
  const el = document.getElementById('quizBody');

  if (!qWord) {
    el.innerHTML = `<div class="empty-quiz">${t('noWords').replace('\n', '<br>')}</div>`;
    return;
  }

  const isSK = qDir === 'sk';
  const isListen = qDir === 'listen';
  const isGender = qDir === 'gender';
  const isCloze = qDir === 'cloze';
  const showSpanish = isSK || isGender;
  const dirLabel = isGender ? t('dirGender')
    : isListen ? t('dirListen')
    : isCloze ? t('dirCloze')
    : (isSK ? t('dirSK') : t('dirKS'));
  const placeholder = isSK ? t('answerSK') : t('answerKS');
  const genderLabel = qWord.gender !== 'none' ? t(qWord.gender) : '';

  const meta = qWord.test_count > 0
    ? `<b>${qWord.test_count}</b> ${t('tested')} · <b>${qWord.correct_count}</b> ${t('correctN')}`
    : '—';

  // 빈칸 문제: 예문에서 단어 자리를 밑줄로 (대소문자 무시, 첫 위치)
  const clozeHTML = () => {
    const s = qSentence.es_text;
    const i = s.toLowerCase().indexOf(qWord.word.toLowerCase());
    const blanked = i < 0 ? s
      : s.slice(0, i) + '<span class="cloze-blank" id="clozeBlank"></span>' + s.slice(i + qWord.word.length);
    const trans = qSentence.ko_text || qSentence.en_text || '';
    return `<div class="cloze-text">${blanked}</div>
      <div class="cloze-hint">${qWord.meaning}</div>
      <div class="cloze-trans" id="clozeTrans" style="display:none">${trans}</div>`;
  };

  // 받아쓰기: 단어 대신 재생 버튼, 정답 확인 후 단어·뜻 공개
  const cardBody = isListen
    ? `<button class="play-btn" onclick="speak(qWord.word)">▶</button>
       <div class="listen-hint">${t('listenHint')}</div>
       <div class="quiz-word" id="listenWord" style="display:none;margin-top:14px">${qWord.word}</div>
       <div class="word-meta" id="listenMeaning" style="display:none">${qWord.meaning}</div>`
    : isCloze
    ? clozeHTML()
    : `<div class="quiz-word${showSpanish ? '' : ' quiz-word-kr'}">${showSpanish ? qWord.word : qWord.meaning}</div>
       ${showSpanish ? `<button class="tts-btn" onclick="speak(qWord.word)">${TTS_ICON}</button>` : ''}
       ${genderLabel && !isGender ? `<div class="gender-badge" data-g="${qWord.gender}">${genderLabel}</div>` : ''}`;

  // 관사 문제는 입력창 대신 el/la 선택 버튼
  const answerUI = isGender
    ? `<div class="gender-answer">
         <button class="g-opt big" id="ga-m" onclick="answerGender('m')">el</button>
         <button class="g-opt big" id="ga-f" onclick="answerGender('f')">la</button>
       </div>`
    : `<div class="answer-row">
         <input class="answer-input" id="answerInput" type="text"
                placeholder="${placeholder}" autocomplete="off" spellcheck="false">
         <button class="submit-btn" id="submitBtn" onclick="checkAnswer()">→</button>
       </div>`;

  el.innerHTML = `
    ${qHard ? `<div class="practice-note hard">${t('hardNote')}</div>`
      : qWord.due === false ? `<div class="practice-note">${t('reviewDone')}</div>` : ''}
    <div class="word-card" id="qCard">
      <div class="quiz-dir">${dirLabel}</div>
      ${cardBody}
      <div class="word-meta">${meta}</div>
    </div>
    ${answerUI}
    <div class="quiz-fb" id="qFb"></div>
    <div class="correct-reveal" id="correctReveal">
      <span class="reveal-label" id="revealLabel">${t('correctAnswer')}</span>
      <span class="reveal-word" id="revealWord"></span>
    </div>
    <button class="next-btn" id="nextBtn" onclick="startQuiz()">${t('next')}</button>
  `;

  if (!isGender) {
    const input = document.getElementById('answerInput');
    input.focus();
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.stopPropagation(); // 같은 Enter가 문서 레벨의 '다음 문제' 핸들러까지 올라가지 않게
        checkAnswer();
      }
    });
    addAccentShortcut(input);
  }
}

let wlCache = {};

// 성을 안료로 표시: 관사를 단어 앞에 함께 보여줘 자연스럽게 외우게 함
const ARTICLE = { m: 'el', f: 'la', n: 'el/la' };

function wlItemHTML(w) {
  const art = ARTICLE[w.gender]
    ? `<span class="art" data-g="${w.gender}">${ARTICLE[w.gender]}</span> `
    : '';
  const stat = w.test_count > 0
    ? `${w.test_count} ${t('tested')} · ${w.correct_count} ${t('correctN')}`
    : '—';
  return `
    <span class="wl-ink" data-g="${w.gender}"></span>
    <div class="wl-left">
      <div class="wl-word">${art}${w.word}<button class="tts-btn sm" onclick="event.stopPropagation();speak(this.closest('.wl-item').dataset.word)">${TTS_ICON}</button></div>
      <div class="wl-meaning">${w.meaning}</div>
    </div>
    <div class="wl-right">
      <div class="wl-stat">${stat}</div>
      <span class="wl-edit-glyph">✎</span>
    </div>`;
}

// ── Edit sheet ────────────────────────────────────────
let editTarget = null;
let editGender = 'none';
let deleteTimer = null;

function openEditSheet(word) {
  const w = wlCache[word];
  if (!w) return;
  editTarget = word;
  document.getElementById('editWord').value = w.word;
  document.getElementById('editMeaning').value = w.meaning;
  pickEditGender(w.gender);
  resetDeleteBtn();
  document.getElementById('editMsg').textContent = '';
  history.pushState({ view: curView, sheet: true }, '');
  document.getElementById('editSheet').classList.add('open');
  document.getElementById('sheetOverlay').classList.add('open');
}

function doCloseSheet() {
  editTarget = null;
  clearTimeout(deleteTimer);
  document.getElementById('editSheet').classList.remove('open');
  document.getElementById('sheetOverlay').classList.remove('open');
}

// 히스토리를 한 칸 되감아 닫음 → popstate에서 doCloseSheet 실행
function closeEditSheet() {
  if (document.getElementById('editSheet').classList.contains('open')) history.back();
}

function pickEditGender(g) {
  editGender = g;
  ['m', 'f', 'n', 'none'].forEach(x =>
    document.getElementById('eg-' + x).classList.toggle('on', x === g)
  );
}

function findWlItem(word) {
  return [...document.querySelectorAll('#wlBody .wl-item')]
    .find(item => item.dataset.word === word);
}

async function saveEditSheet() {
  if (!editTarget) return;
  const newWord = document.getElementById('editWord').value.trim().toLowerCase();
  const meaning = document.getElementById('editMeaning').value.trim();
  const msg = document.getElementById('editMsg');
  if (!newWord || !meaning) return;
  try {
    await api('PUT', `/api/words/${encodeURIComponent(editTarget)}`, { word: newWord, gender: editGender, meaning });
    const updated = { ...wlCache[editTarget], word: newWord, gender: editGender, meaning };
    const item = findWlItem(editTarget);
    delete wlCache[editTarget];
    wlCache[newWord] = updated;
    if (item) {
      item.dataset.word = newWord;
      item.innerHTML = wlItemHTML(updated);
    }
    closeEditSheet();
  } catch (err) {
    msg.style.color = 'var(--rust)';
    msg.textContent = err.detail === 'duplicate' ? t('duplicate') : (err.detail || '!');
    setTimeout(() => { msg.textContent = ''; }, 2000);
  }
}

function resetDeleteBtn() {
  const b = document.getElementById('editDelete');
  b.classList.remove('armed');
  b.textContent = t('delete');
}

async function deleteFromSheet() {
  if (!editTarget) return;
  const b = document.getElementById('editDelete');
  if (!b.classList.contains('armed')) {
    b.classList.add('armed');
    b.textContent = t('confirmDelete');
    clearTimeout(deleteTimer);
    deleteTimer = setTimeout(resetDeleteBtn, 3000);
    return;
  }
  clearTimeout(deleteTimer);
  try {
    await api('DELETE', `/api/words/${encodeURIComponent(editTarget)}`);
    const item = findWlItem(editTarget);
    delete wlCache[editTarget];
    if (item) item.remove();
    closeEditSheet();
    if (!Object.keys(wlCache).length) {
      document.getElementById('wlBody').innerHTML =
        `<div class="empty-quiz">${t('noWords').replace('\n', '<br>')}</div>`;
    }
    filterWordList();
  } catch (e) {
    resetDeleteBtn();
  }
}

// 악센트 무시 비교용: dónde → donde, español → espanol
const deaccent = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');

// 채점용 악센트 제거: ñ은 별개 글자이므로 유지 (U+0303 결합 틸데만 남김)
const deaccentGrading = s =>
  s.normalize('NFD').replace(/[\u0300-\u0302\u0304-\u036f]/g, '').normalize('NFC');

function filterWordList() {
  const q = deaccent(document.getElementById('wlSearch').value.trim().toLowerCase());
  let shown = 0;
  const total = Object.keys(wlCache).length;
  document.querySelectorAll('#wlBody .wl-item').forEach(item => {
    const w = wlCache[item.dataset.word];
    const match = !q || deaccent(w.word).includes(q) || deaccent(w.meaning.toLowerCase()).includes(q);
    item.style.display = match ? '' : 'none';
    if (match) shown++;
  });
  const countEl = document.getElementById('wlCount');
  countEl.textContent = q
    ? `${shown} / ${total} ${t('words')}`
    : `${total} ${t('words')}`;
}

function startWordList() {
  go('wordList');
  loadWordListBody();
}

async function loadWordListBody() {
  const body = document.getElementById('wlBody');
  const countEl = document.getElementById('wlCount');
  const searchEl = document.getElementById('wlSearch');
  searchEl.value = '';
  searchEl.oninput = filterWordList;
  wlCache = {};
  try {
    const words = await api('GET', '/api/words');
    words.forEach(w => { wlCache[w.word] = w; });
    countEl.textContent = `${words.length} ${t('words')}`;
    if (!words.length) {
      body.innerHTML = `<div class="empty-quiz">${t('noWords').replace('\n', '<br>')}</div>`;
      return;
    }
    body.innerHTML = words.map(w =>
      `<div class="wl-item" data-word="${w.word}" onclick="openEditSheet(this.dataset.word)">${wlItemHTML(w)}</div>`
    ).join('');
    // 터치 기기에서는 자동 포커스 시 키보드가 바로 올라와 목록을 가림
    if (matchMedia('(hover: hover)').matches) searchEl.focus();
  } catch (e) {
    body.innerHTML = '';
    countEl.textContent = '';
  }
}

async function checkAnswer() {
  if (qAnswered || !qWord) return;
  const input = document.getElementById('answerInput');
  const userAnswer = input.value.trim();
  if (!userAnswer) return;

  qAnswered = true;
  const correctAnswer = qDir === 'sk' ? qWord.meaning : qWord.word;
  const alts = correctAnswer.split(',').map(s => s.trim()).filter(Boolean);
  // 대소문자·띄어쓰기 차이는 무시하고 비교 ("일 하다" = "일하다")
  const norm = s => s.toLowerCase().replace(/\s+/g, '');
  const matched = alts.find(a => norm(a) === norm(userAnswer)) || null;
  let ok = matched !== null;

  // 스페인어 입력 방향(번역·받아쓰기): 모음 악센트만 틀렸으면 정답 처리하되 올바른 표기를 안내
  // (ñ은 별개 글자이므로 관대 처리 대상이 아님)
  let accentWord = null;
  if (!ok && qDir !== 'sk') {
    accentWord = alts.find(a => deaccentGrading(norm(a)) === deaccentGrading(norm(userAnswer))) || null;
    if (accentWord) ok = true;
  }

  input.disabled = true;

  // 스페인어를 입력한 문제는 정답 확인 직후 발음을 들려줌
  if (qDir !== 'sk') speak(qWord.word);
  if (qDir === 'listen') {
    document.getElementById('listenWord').style.display = '';
    document.getElementById('listenMeaning').style.display = '';
  }
  if (qDir === 'cloze') {
    // 빈칸을 정답 단어로 채우고 번역 공개
    const blank = document.getElementById('clozeBlank');
    if (blank) { blank.textContent = qWord.word; blank.classList.add('filled'); }
    const tr = document.getElementById('clozeTrans');
    if (tr && tr.textContent) tr.style.display = '';
  }

  try {
    await api('POST', '/api/quiz/answer', { word: qWord.word, correct: ok });
  } catch (e) {}

  document.getElementById('qCard').classList.add(ok ? 'state-ok' : 'state-err');

  const fb = document.getElementById('qFb');
  fb.textContent = accentWord ? t('accentFb') : (ok ? t('correct') : t('wrong'));
  fb.className = 'quiz-fb ' + (ok ? 'ok' : 'err');

  if (!ok) {
    document.getElementById('revealWord').textContent = correctAnswer;
    document.getElementById('correctReveal').classList.add('show');
  } else if (accentWord) {
    document.getElementById('revealLabel').textContent = t('accentTitle');
    // 틀린 글자(악센트 자리)만 금색으로 강조
    document.getElementById('revealWord').innerHTML = accentWord.split('').map(ch =>
      deaccentGrading(ch) !== ch ? `<span class="acc">${ch}</span>` : ch
    ).join('');
    document.getElementById('correctReveal').classList.add('accent', 'show');
  } else if (qDir === 'sk' && alts.length > 1) {
    // 뜻이 여러 개면 맞힌 것 외의 나머지 뜻도 보여줘 복습 효과
    const others = alts.filter(a => a !== matched);
    document.getElementById('revealLabel').textContent = t('alsoTitle');
    document.getElementById('revealWord').textContent = others.join(', ');
    document.getElementById('correctReveal').classList.add('also', 'show');
  }

  document.getElementById('nextBtn').classList.add('show');
}

// ── Add Word ──────────────────────────────────────────
function pickGender(g) {
  if (selGender === g) {
    selGender = null;
    document.getElementById('g' + g).classList.remove('on');
  } else {
    selGender = g;
    ['m', 'f', 'n'].forEach(x =>
      document.getElementById('g' + x).classList.toggle('on', x === g)
    );
  }
  updateNoneHint();
  checkReady();
}

function checkReady() {
  const word = document.getElementById('wordInput').value.trim();
  const meaning = document.getElementById('meaningInput').value.trim();
  document.getElementById('addBtn').disabled = !(word && meaning);
}

document.getElementById('wordInput').addEventListener('input', checkReady);
document.getElementById('wordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('meaningInput').focus();
});
document.getElementById('meaningInput').addEventListener('input', checkReady);
document.getElementById('meaningInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('addBtn').click();
});

const SHORTCUTS = { KeyA: 'á', KeyE: 'é', KeyI: 'í', KeyO: 'ó', KeyU: 'ú', KeyN: 'ñ', Slash: '¿', Digit1: '¡' };
const SHORTCUTS_UPPER = { KeyA: 'Á', KeyE: 'É', KeyI: 'Í', KeyO: 'Ó', KeyU: 'Ú', KeyN: 'Ñ' };

function addAccentShortcut(input) {
  input.addEventListener('keydown', e => {
    if (!e.altKey) return;
    const char = (e.shiftKey && SHORTCUTS_UPPER[e.code]) || SHORTCUTS[e.code];
    if (!char) return;
    e.preventDefault();
    const s = input.selectionStart;
    input.value = input.value.slice(0, s) + char + input.value.slice(input.selectionEnd);
    input.setSelectionRange(s + 1, s + 1);
    if (input.id === 'wordInput') checkReady();
  });
}

async function addWord() {
  const word = document.getElementById('wordInput').value.trim().toLowerCase();
  if (!word) return;

  const gender = selGender ?? 'none';
  const meaning = document.getElementById('meaningInput').value.trim();
  const msg = document.getElementById('addMsg');

  try {
    await api('POST', '/api/words', { word, gender, meaning });

    document.getElementById('wordInput').value = '';
    document.getElementById('meaningInput').value = '';
    selGender = null;
    ['m', 'f', 'n'].forEach(x => document.getElementById('g' + x).classList.remove('on'));
    document.getElementById('addBtn').disabled = true;
    updateNoneHint();

    msg.style.color = 'var(--sage)';
    msg.textContent = t('added');
    setTimeout(() => { msg.textContent = ''; }, 2000);
  } catch (err) {
    msg.style.color = 'var(--rust)';
    msg.textContent = err.detail === 'duplicate' ? t('duplicate') : (err.detail || t('duplicate'));
    setTimeout(() => { msg.textContent = ''; }, 2000);
  }
}

// ── Init ──────────────────────────────────────────────
setLang(lang); // updateStats()까지 함께 호출됨
updateNoneHint();

// 새로고침 시 브라우저가 보존한 히스토리 상태로 화면 복원
if (history.state && history.state.view && history.state.view !== 'home') {
  loadView(history.state.view);
} else {
  history.replaceState({ view: 'home' }, '');
}
addAccentShortcut(document.getElementById('wordInput'));
addAccentShortcut(document.getElementById('editWord'));

document.getElementById('editWord').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('editMeaning').focus();
});
document.getElementById('editMeaning').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveEditSheet();
});

// 모바일 키보드 감지: 뷰포트가 크게 줄면 키보드가 열린 것으로 보고
// 퀴즈 카드를 압축한 뒤 화면 안으로 스크롤
if (window.visualViewport && matchMedia('(hover: none)').matches) {
  visualViewport.addEventListener('resize', () => {
    const kbOpen = visualViewport.height < screen.height * 0.72;
    document.body.classList.toggle('kb-open', kbOpen);
    if (kbOpen && curView === 'quiz' && !qAnswered) {
      const card = document.getElementById('qCard');
      if (card) {
        const top = card.getBoundingClientRect().top + window.scrollY - 60;
        window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      }
    }
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('editSheet').classList.contains('open')) closeEditSheet();
    else if (document.getElementById('drawer').classList.contains('open')) toggleDrawer();
    return;
  }
  // 정답 확인 후 Enter → 다음 문제
  if (e.key === 'Enter' && qAnswered
      && document.getElementById('vQuiz').classList.contains('active')
      && !document.getElementById('editSheet').classList.contains('open')) {
    startQuiz();
  }
});

// ── PWA ───────────────────────────────────────────────
// 서비스워커는 보안 컨텍스트(https 또는 localhost)에서만 등록 가능
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
