# LSHobby 전용 tailnet 이름 lshobby.<테일넷>.ts.net (#100, docs/16 §16.5).
# 폰은 같은 호스트 이름의 홈 화면 앱을 하나로 취급해서 LSHobby(:8443)와 가계부(:8444)를 둘 다 설치할 수 없었다.
# 가계부가 먼저 별도 장치(lshab, 가계부 리포 ops/tailscale-lshab)로 나갔고 이 파일은 그 사본이다.
# 이 컨테이너가 tailnet에 "lshobby" 장치로 붙고, 443으로 받은 요청을 호스트의 127.0.0.1:3000(next start)으로 넘긴다.
#   docker compose -f ops/tailscale-lshobby/compose.yml up -d   (처음 한 번은 아래 로그인·serve 명령도)
services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: lshobby-tailscale
    hostname: lshobby
    # 앱이 127.0.0.1에만 바인드되어 있어 호스트 네트워크를 쓴다. 커널 TUN 대신 userspace로 돌아 호스트의 tailscale0과
    # 겹치지 않고, 443도 호스트 소켓이 아니라 userspace 넷스택 안에서 받으므로 kind 클러스터의 0.0.0.0:443과 충돌하지 않는다.
    network_mode: host
    restart: unless-stopped
    # 기본 containerboot는 대화형 로그인을 1분만 기다리고 재시작해 키를 새로 만든다. tailscaled만 띄우고
    # 로그인·serve는 한 번 손으로 한다(상태는 볼륨에 남아 재시작 뒤에도 유지된다):
    #   docker exec lshobby-tailscale tailscale --socket=/tmp/tailscaled.sock up --hostname=lshobby
    #   docker exec lshobby-tailscale tailscale --socket=/tmp/tailscaled.sock serve --bg --https=443 http://127.0.0.1:3000
    # 로그인 뒤 관리 콘솔(Machines → lshobby → Disable key expiry)에서 키 만료를 꺼야 한다 — 기본 180일이라
    # 안 끄면 반년 뒤 조용히 떨어져 나간다. 사람이 쓰는 기기가 아니라 재로그인해 줄 사람이 없다.
    # 호스트 tailscaled가 41641, lshab가 41642를 쓰므로 WireGuard 포트를 비켜 둔다.
    entrypoint: ["tailscaled", "--tun=userspace-networking", "--statedir=/var/lib/tailscale", "--socket=/tmp/tailscaled.sock", "--port=41643"]
    volumes:
      - state:/var/lib/tailscale
volumes:
  state:
